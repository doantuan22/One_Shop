# Optional: nginx on the same EC2 host when you do NOT put an Application Load Balancer in front.
# TLS certificates (for example from Let's Encrypt / certbot) are referenced below; replace the server name.
# With an ALB, terminate TLS on the ALB instead and forward port 80 -> 8080 (Spring trusts X-Forwarded-* in the prod profile).
# Brute-force guard: POSTs to login/register/forgot-password, per client IP. Other requests get an empty key (unlimited).
map "$request_method $uri" $oneshop_auth_key {
    default "";
    ~^POST\ /(login|api/auth/login|register|api/auth/register|forgot-password) $binary_remote_addr;
}
limit_req_zone $oneshop_auth_key zone=oneshop_auth:10m rate=20r/m;

server {
    listen 80;
    server_name shop.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name shop.example.com;
    ssl_certificate     /etc/letsencrypt/live/shop.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop.example.com/privkey.pem;

    limit_req zone=oneshop_auth burst=10 nodelay;
    limit_req_status 429;

    client_max_body_size 6m;   # application limit is 5 MB per image (6 MB per request)

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
