# Optional: nginx on the same EC2 host when you do NOT put an Application Load Balancer in front.
# TLS certificates (for example from Let's Encrypt / certbot) are referenced below; replace the server name.
# With an ALB, terminate TLS on the ALB instead and forward port 80 -> 8080 (Spring trusts X-Forwarded-* in the prod profile).
server {
    listen 80;
    server_name shop.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name shop.example.com;
    ssl_certificate     /etc/letsencrypt/live/shop.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop.example.com/privkey.pem;

    client_max_body_size 6m;   # application limit is 5 MB per image (6 MB per request)

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
