name: Deploy OneShop demo to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: oneshop-demo-main
  cancel-in-progress: false

jobs:
  deploy:
    # Keep deploy disabled until the private database is seeded, the app env is stored in SSM,
    # and HTTPS is configured. These are non-secret repository variables.
    if: ${{ vars.AWS_DEPLOY_READY == 'true' && vars.AWS_DEPLOY_ROLE_ARN != '' && vars.AWS_DEPLOY_BUCKET != '' && vars.AWS_DEPLOY_INSTANCE_ID != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AWS_REGION: ap-southeast-1
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      AWS_DEPLOY_BUCKET: ${{ vars.AWS_DEPLOY_BUCKET }}
      AWS_DEPLOY_INSTANCE_ID: ${{ vars.AWS_DEPLOY_INSTANCE_ID }}
    steps:
      - name: Check out main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Java 21
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: corretto
          java-version: '21'
          cache: maven
      - name: Build deployable jar
        run: bash ./mvnw -B -DskipTests package
      - name: Configure short-lived AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Upload immutable release artifacts
        env:
          VERSION: ${{ github.sha }}
        run: |
          aws s3 cp target/oneshop.jar "s3://${AWS_DEPLOY_BUCKET}/artifacts/oneshop-${VERSION}.jar" --sse AES256 --only-show-errors
          aws s3 cp deploy/aws/deploy-release.sh "s3://${AWS_DEPLOY_BUCKET}/artifacts/oneshop-${VERSION}-deploy.sh" --sse AES256 --only-show-errors
      - name: Deploy through Systems Manager and verify health
        env:
          VERSION: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          JAR_KEY="artifacts/oneshop-${VERSION}.jar"
          SCRIPT_KEY="artifacts/oneshop-${VERSION}-deploy.sh"
          REMOTE_COMMAND="aws s3 cp s3://${AWS_DEPLOY_BUCKET}/${SCRIPT_KEY} /tmp/oneshop-deploy-${VERSION}.sh --only-show-errors && bash /tmp/oneshop-deploy-${VERSION}.sh ${AWS_DEPLOY_BUCKET} ${JAR_KEY} ${VERSION}"
          jq -n --arg command "$REMOTE_COMMAND" '{commands: [$command]}' > /tmp/oneshop-ssm-parameters.json
          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$AWS_DEPLOY_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --timeout-seconds 300 \
            --max-concurrency 1 \
            --max-errors 0 \
            --parameters file:///tmp/oneshop-ssm-parameters.json \
            --query 'Command.CommandId' --output text)"
          for attempt in $(seq 1 60); do
            STATUS="$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$AWS_DEPLOY_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)"
            case "$STATUS" in
              Success)
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$AWS_DEPLOY_INSTANCE_ID" --query StandardOutputContent --output text
                exit 0
                ;;
              Failed|TimedOut|Cancelled|Cancelling)
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$AWS_DEPLOY_INSTANCE_ID" --query '{Status:Status,ExitCode:ResponseCode,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json
                exit 1
                ;;
            esac
            sleep 5
          done
          echo "SSM deployment command ${COMMAND_ID} did not finish in five minutes." >&2
          exit 1
