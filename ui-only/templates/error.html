<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Có lỗi xảy ra | OneShop</title>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="d-flex flex-column min-vh-100">
<!-- Error pages are produced by an ERROR dispatch, which SiteMesh does not decorate, so reuse the fragments directly. -->
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="flex-grow-1 py-5">
    <div class="container text-center">
        <p class="display-3 fw-bold text-primary mb-2" th:text="${status}">500</p>
        <h1 class="h4 mb-3" th:text="${status == 404} ? 'Không tìm thấy trang' : (${status == 403} ? 'Bạn không có quyền truy cập' : 'Đã có lỗi xảy ra')">Đã có lỗi xảy ra</h1>
        <p class="text-secondary" th:if="${message}" th:text="${message}"></p>
        <a class="btn btn-primary" th:href="@{/}">Về trang chủ</a>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/vendor/bootstrap/bootstrap.bundle.min.js}"></script>
</body>
</html>
