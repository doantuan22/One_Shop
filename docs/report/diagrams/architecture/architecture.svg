<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1010" viewBox="0 0 1000 1010" font-family="Arial, Helvetica, sans-serif"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9 z" fill="#222"/></marker></defs><rect width="1000" height="1010" fill="#fff"/><rect x="250" y="14" width="500" height="62" rx="10" fill="#fff4e6" stroke="#333" stroke-width="1.4"/><text x="500.0" y="41.0" text-anchor="middle" font-size="15" font-weight="bold">Trình duyệt (Client Browser)</text><text x="500.0" y="59.0" text-anchor="middle" font-size="15">HTML do Thymeleaf dựng, Bootstrap, JavaScript (static/js)</text><rect x="40" y="14" width="170" height="62" rx="31" fill="#fff" stroke="#333" stroke-width="1.4" stroke-dasharray="6 4"/><text x="125.0" y="32.0" text-anchor="middle" font-size="13">Khách vãng lai / Khách</text><text x="125.0" y="50.0" text-anchor="middle" font-size="13">hàng / Nhân viên /</text><text x="125.0" y="68.0" text-anchor="middle" font-size="13">Quản trị viên</text><line x1="210" y1="45" x2="250" y2="45" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><rect x="20" y="118" width="700" height="760" rx="14" fill="#fcfcfc" stroke="#2b6cb0" stroke-width="2"/><text x="36" y="142" font-size="16" font-weight="bold" fill="#2b6cb0">Ứng dụng Spring Boot OneShop (Java 21)</text><rect x="36" y="156" width="668" height="112" rx="8" fill="#f6f8fb" stroke="#8aa" stroke-width="1.2"/><text x="46" y="175" font-size="14" font-weight="bold" fill="#345">1. Bộ lọc (Filter) và bảo mật</text><rect x="48" y="182" width="200" height="72" rx="10" fill="#fff" stroke="#333" stroke-width="1.4"/><text x="148.0" y="205.0" text-anchor="middle" font-size="13">Spring Security</text><text x="148.0" y="223.0" text-anchor="middle" font-size="13">(SecurityConfig, phân</text><text x="148.0" y="241.0" text-anchor="middle" font-size="13">quyền URL, CSRF)</text><rect x="260" y="182" width="200" height="72" rx="10" fill="#fff" stroke="#333" stroke-width="1.4"/><text x="360.0" y="196.0" text-anchor="middle" font-size="13">JwtAuthenticationFilter</text><text x="360.0" y="214.0" text-anchor="middle" font-size="13">(JWT từ cookie</text><text x="360.0" y="232.0" text-anchor="middle" font-size="13">ONESHOP_TOKEN hoặc</text><text x="360.0" y="250.0" text-anchor="middle" font-size="13">Bearer)</text><rect x="472" y="182" width="220" height="72" rx="10" fill="#fff" stroke="#333" stroke-width="1.4"/><text x="582.0" y="205.0" text-anchor="middle" font-size="13">SiteMesh Filter</text><text x="582.0" y="223.0" text-anchor="middle" font-size="13">(3 decorator: client, staff,</text><text x="582.0" y="241.0" text-anchor="middle" font-size="13">admin)</text><rect x="36" y="286" width="668" height="96" rx="8" fill="#f6f8fb" stroke="#8aa" stroke-width="1.2"/><text x="46" y="305" font-size="14" font-weight="bold" fill="#345">2. Interceptor (Spring MVC)</text><rect x="48" y="310" width="320" height="60" rx="10" fill="#fff" stroke="#333" stroke-width="1.4"/><text x="208.0" y="336.0" text-anchor="middle" font-size="13">SelectedStoreInterceptor</text><text x="208.0" y="354.0" text-anchor="middle" font-size="13">(chi nhánh khách đang xem, cookie)</text><rect x="380" y="310" width="312" height="60" rx="10" fill="#fff" stroke="#333" stroke-width="1.4"/><text x="536.0" y="336.0" text-anchor="middle" font-size="13">StaffStoreScopeInterceptor</text><text x="536.0" y="354.0" text-anchor="middle" font-size="13">(chi nhánh nhân viên được phân công)</text><rect x="36" y="400" width="668" height="112" rx="8" fill="#f6f8fb" stroke="#8aa" stroke-width="1.2"/><text x="46" y="419" font-size="14" font-weight="bold" fill="#345">3. Tầng trình bày và điều khiển</text><rect x="48" y="426" width="320" height="72" rx="10" fill="#fff" stroke="#333" stroke-width="1.4"/><text x="208.0" y="458.0" text-anchor="middle" font-size="13">Controller</text><text x="208.0" y="476.0" text-anchor="middle" font-size="13">(client, staff, admin, api: 37 lớp)</text><rect x="380" y="426" width="312" height="72" rx="10" fill="#fff" stroke="#333" stroke-width="1.4"/><text x="536.0" y="458.0" text-anchor="middle" font-size="13">Thymeleaf templates + Bootstrap</text><text x="536.0" y="476.0" text-anchor="middle" font-size="13">(layouts/client, staff, admin, fragments)</text><rect x="36" y="530" width="668" height="190" rx="8" fill="#f6f8fb" stroke="#8aa" stroke-width="1.2"/><text x="46" y="549" font-size="14" font-weight="bold" fill="#345">4. Tầng nghiệp vụ (Service)</text><rect x="48" y="556" width="156" height="74" rx="10" fill="#fff" stroke="#333" stroke-width="1.4"/><text x="126.0" y="571.0" text-anchor="middle" font-size="12">Giỏ hàng, đặt hàng,</text><text x="126.0" y="589.0" text-anchor="middle" font-size="12">phân bổ nguồn hàng</text><text x="126.0" y="607.0" text-anchor="middle" font-size="12">(AllocationEngine),</text><text x="126.0" y="625.0" text-anchor="middle" font-size="12">khuyến mãi</text><rect x="214" y="556" width="156" height="74" rx="10" fill="#fff" stroke="#333" stroke-width="1.4"/><text x="292.0" y="571.0" text-anchor="middle" font-size="12">Thanh toán mô</text><text x="292.0" y="589.0" text-anchor="middle" font-size="12">phỏng, đối soát, hủy</text><text x="292.0" y="607.0" text-anchor="middle" font-size="12">đơn, hoàn tiền, hoàn</text><text x="292.0" y="625.0" text-anchor="middle" font-size="12">trả</text><rect x="380" y="556" width="156" height="74" rx="10" fill="#fff" stroke="#333" stroke-width="1.4"/><text x="458.0" y="580.0" text-anchor="middle" font-size="12">Fulfillment, tồn kho,</text><text x="458.0" y="598.0" text-anchor="middle" font-size="12">hàng trả, phạm vi chi</text><text x="458.0" y="616.0" text-anchor="middle" font-size="12">nhánh nhân viên</text><rect x="546" y="556" width="146" height="74" rx="10" fill="#fff" stroke="#333" stroke-width="1.4"/><text x="619.0" y="580.0" text-anchor="middle" font-size="12">Sản phẩm, chi</text><text x="619.0" y="598.0" text-anchor="middle" font-size="12">nhánh, đánh giá, tài</text><text x="619.0" y="616.0" text-anchor="middle" font-size="12">khoản, xác thực</text><rect x="48" y="644" width="322" height="62" rx="10" fill="#eef7ee" stroke="#333" stroke-width="1.4"/><text x="209.0" y="680.0" text-anchor="middle" font-size="13">Mapper, DTO (record request / response)</text><rect x="380" y="644" width="312" height="62" rx="10" fill="#eef7ee" stroke="#333" stroke-width="1.4"/><text x="536.0" y="671.0" text-anchor="middle" font-size="13">Tác vụ nền PaymentTimeoutWorker</text><text x="536.0" y="689.0" text-anchor="middle" font-size="13">(@Scheduled)</text><rect x="36" y="738" width="668" height="124" rx="8" fill="#f6f8fb" stroke="#8aa" stroke-width="1.2"/><text x="46" y="757" font-size="14" font-weight="bold" fill="#345">5. Tầng truy cập dữ liệu</text><rect x="48" y="764" width="644" height="84" rx="10" fill="#fff" stroke="#333" stroke-width="1.4"/><text x="370.0" y="793.0" text-anchor="middle" font-size="13">Spring Data JPA / Hibernate: 29 Repository, các Entity (User, Product, StoreProduct, Order,</text><text x="370.0" y="811.0" text-anchor="middle" font-size="13">OrderFulfillment, Payment, ...). ddl-auto=validate, giao dịch @Transactional, khóa dòng (FOR</text><text x="370.0" y="829.0" text-anchor="middle" font-size="13">UPDATE)</text><rect x="740" y="628" width="240" height="90" rx="10" fill="#e7f5ff" stroke="#333" stroke-width="1.4"/><text x="860.0" y="651.0" text-anchor="middle" font-size="13" font-weight="bold">Cloudinary</text><text x="860.0" y="669.0" text-anchor="middle" font-size="13">Lưu ảnh sản phẩm, danh mục,</text><text x="860.0" y="687.0" text-anchor="middle" font-size="13">thương hiệu, ảnh trả hàng</text><text x="860.0" y="705.0" text-anchor="middle" font-size="13">(HTTPS)</text><rect x="740" y="736" width="240" height="80" rx="10" fill="#e7f5ff" stroke="#333" stroke-width="1.4"/><text x="860.0" y="763.0" text-anchor="middle" font-size="13" font-weight="bold">Máy chủ SMTP</text><text x="860.0" y="781.0" text-anchor="middle" font-size="13">Gửi mã OTP quên mật khẩu (nếu</text><text x="860.0" y="799.0" text-anchor="middle" font-size="13">cấu hình MAIL_HOST)</text><rect x="740" y="520" width="240" height="92" rx="10" fill="#fff9db" stroke="#333" stroke-width="1.4"/><text x="860.0" y="544.0" text-anchor="middle" font-size="12">Cổng thanh toán MÔ PHỎNG</text><text x="860.0" y="562.0" text-anchor="middle" font-size="12">(MockPaymentGateway,</text><text x="860.0" y="580.0" text-anchor="middle" font-size="12">MockLedger: chạy trong ứng</text><text x="860.0" y="598.0" text-anchor="middle" font-size="12">dụng, không kết nối ngân hàng)</text><rect x="200" y="912" width="400" height="76" rx="10" fill="#e6fcf5" stroke="#333" stroke-width="1.4"/><text x="400.0" y="937.0" text-anchor="middle" font-size="15" font-weight="bold">SQL Server (cơ sở dữ liệu oneshop)</text><text x="400.0" y="955.0" text-anchor="middle" font-size="15">30 bảng: users, products, store_products, orders,</text><text x="400.0" y="973.0" text-anchor="middle" font-size="15">order_fulfillments, payments, ...</text><line x1="500" y1="76" x2="500" y2="156" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><text x="508" y="108" font-size="13" font-style="italic">HTTP request</text><line x1="380" y1="76" x2="380" y2="156" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><circle cx="440" cy="106" r="11" fill="#e8590c"/><text x="440" y="111" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">1</text><line x1="370" y1="268" x2="370" y2="286" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><circle cx="352" cy="277" r="11" fill="#e8590c"/><text x="352" y="282" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">2</text><line x1="370" y1="382" x2="370" y2="400" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><circle cx="352" cy="391" r="11" fill="#e8590c"/><text x="352" y="396" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">3</text><line x1="370" y1="512" x2="370" y2="530" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><circle cx="352" cy="521" r="11" fill="#e8590c"/><text x="352" y="526" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">4</text><line x1="370" y1="720" x2="370" y2="738" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><circle cx="352" cy="729" r="11" fill="#e8590c"/><text x="352" y="734" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">5</text><line x1="400" y1="862" x2="400" y2="912" stroke="#222" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/><text x="410" y="892" font-size="13" font-style="italic">JDBC (SQL Server)</text><circle cx="380" cy="886" r="11" fill="#e8590c"/><text x="380" y="891" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">6</text><line x1="704" y1="566" x2="740" y2="566" stroke="#222" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/><line x1="704" y1="673" x2="740" y2="673" stroke="#222" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/><line x1="704" y1="704" x2="740" y2="760" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><line x1="620" y1="156" x2="620" y2="76" stroke="#e8590c" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a)"/><text x="632" y="98" font-size="13" font-style="italic" fill="#e8590c">HTML (đã gắn layout)</text><circle cx="606" cy="116" r="11" fill="#e8590c"/><text x="606" y="121" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">7</text></svg>