# Hibernate must not silently alter the production schema.
# Use JPA_DDL_AUTO=update once deliberately for the first bootstrap, or adopt Flyway/Liquibase later.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.show-sql=false
spring.thymeleaf.cache=true

# Render terminates TLS at its proxy
server.forward-headers-strategy=framework
app.jwt.cookie-secure=${JWT_COOKIE_SECURE:true}

logging.level.com.oneshop=INFO
