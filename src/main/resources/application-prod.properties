# AWS RDS SQL Server certificates use the listener hostname for the DB endpoint. Keep TLS validation enabled.
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:oneshop};encrypt=true;trustServerCertificate=${DB_TRUST_SERVER_CERTIFICATE:false}${DB_JDBC_OPTIONS:};hostNameInCertificate=listener.${DB_HOST:localhost}

# Schema upgrades are explicit SQL operations. Hibernate only validates in every runtime profile.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.thymeleaf.cache=true

# TLS is terminated in front of the application (AWS ALB / nginx / Render): trust X-Forwarded-Proto/-For so redirects,
# secure cookies and HSTS see the original https request
server.forward-headers-strategy=framework
app.jwt.cookie-secure=${JWT_COOKIE_SECURE:true}

logging.level.com.oneshop=INFO

# The payment gateway is the built-in demo gateway (no real money): online payment always succeeds, so it is CLOSED in
# production by default. Set both to true only for a demo deployment (no real shop must run on it).
oneshop.payment.mock-gateway-enabled=${ONESHOP_PAYMENT_MOCK_GATEWAY_ENABLED:false}
# MOCK stays the default so nothing real is switched on by accident: set ONESHOP_PAYMENT_PROVIDER=PAYOS (plus the PAYOS_* keys,
# ONESHOP_PUBLIC_BASE_URL and ONESHOP_CHECKOUT_ONLINE_ENABLED=true) to accept real payments.
oneshop.payment.provider=${ONESHOP_PAYMENT_PROVIDER:MOCK}
oneshop.checkout.online-enabled=${ONESHOP_CHECKOUT_ONLINE_ENABLED:false}
