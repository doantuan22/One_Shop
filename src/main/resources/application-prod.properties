# The schema is owned by database/*.sql. Hibernate must never alter it; use JPA_DDL_AUTO=validate to check it.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.show-sql=false
spring.thymeleaf.cache=true

# Render terminates TLS at its proxy
server.forward-headers-strategy=framework
app.jwt.cookie-secure=${JWT_COOKIE_SECURE:true}

logging.level.com.oneshop=INFO

# The mock payment gateway is a demo/test component: no simulated payment result can be produced in production.
oneshop.payment.mock-gateway-enabled=${ONESHOP_PAYMENT_MOCK_GATEWAY_ENABLED:false}
