# The schema is owned by database/schema + database/migrations. Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Plain HTTP on localhost, so the JWT cookie must not be Secure-only
app.jwt.cookie-secure=${JWT_COOKIE_SECURE:false}

logging.level.com.oneshop=DEBUG

# Development - Hot Reload
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Disable Thymeleaf cache
spring.thymeleaf.cache=false

# Disable static resource cache
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false
