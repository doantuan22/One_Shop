# Optional local .env file (KEY=value lines) is loaded as configuration; ignored when absent.
spring.config.import=optional:file:.env[.properties]

# The schema is owned by database/*.sql (Phase 2). Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.thymeleaf.cache=false

# Plain HTTP on localhost, so the JWT cookie must not be Secure-only
app.jwt.cookie-secure=${JWT_COOKIE_SECURE:false}

logging.level.com.oneshop=DEBUG
