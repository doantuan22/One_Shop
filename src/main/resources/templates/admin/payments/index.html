<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Thanh toán trực tuyến</title>
</head>
<body>
<div class="os-admin-payments">
    <div th:replace="~{fragments/components :: pageHeader('Thanh toán trực tuyến', 'Đơn ONLINE theo trạng thái thanh toán. “Cần xử lý” là nhóm quản trị viên phải can thiệp; “Chờ đối soát” là kết quả chưa xác định còn trong hạn, hệ thống đang đợi bằng chứng. Cổng thanh toán là mô phỏng, không thu tiền thật.')}"></div>

    <div class="os-pills-scroll-container mb-3" style="overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 4px;">
        <ul class="nav nav-pills gap-1 flex-nowrap" id="payment-views" aria-label="Lọc theo trạng thái thanh toán">
            <li class="nav-item flex-shrink-0" th:each="c : ${categories}">
                <a class="nav-link py-1 px-3 text-nowrap" th:classappend="${view == c.key()} ? 'active'" th:attr="aria-current=${view == c.key()} ? 'page'"
                   th:href="@{/admin/payments(view=${c.key()}, q=${q})}">
                    <span th:text="${c.label()}">Cần xử lý</span>
                    <span class="badge text-bg-light border ms-1" th:text="${counts[c.key()]}" th:attr="data-count=${c.key()}">0</span>
                </a>
            </li>
            <li class="nav-item flex-shrink-0">
                <a class="nav-link py-1 px-3 text-nowrap" th:classappend="${view == 'all'} ? 'active'" th:attr="aria-current=${view == 'all'} ? 'page'"
                   th:href="@{/admin/payments(view='all', q=${q})}">Tất cả
                    <span class="badge text-bg-light border ms-1" th:text="${counts['all']}" data-count="all">0</span></a>
            </li>
        </ul>
    </div>

    <form class="row g-2 mb-3" method="get" th:action="@{/admin/payments}" role="search" id="payment-search">
        <input type="hidden" name="view" th:value="${view}">
        <div class="col-12 col-md-6 col-lg-4">
            <label class="visually-hidden" for="payment-q">Tìm theo mã đơn, tên hoặc email khách</label>
            <input class="form-control" id="payment-q" name="q" type="search" maxlength="100" th:value="${q}"
                   placeholder="Mã đơn, tên hoặc email khách">
        </div>
        <div class="col-auto">
            <button class="btn btn-primary" type="submit">Tìm</button>
            <a class="btn btn-outline-secondary" th:if="${!q.isEmpty()}" th:href="@{/admin/payments(view=${view})}">Xóa tìm kiếm</a>
        </div>
    </form>

    <p class="mb-3">Tổng số đơn trong mục này: <strong id="payment-case-count" th:text="${cases.totalElements}"></strong></p>

    <div class="table-responsive">
        <table class="table os-table align-middle">
            <thead>
            <tr>
                <th>Đơn</th><th>Khách hàng</th><th>Phân loại</th><th>Trạng thái đơn</th><th>Thanh toán</th><th>Cổng mô phỏng trả lời</th>
                <th>Hạn thanh toán</th><th>Đối soát đến</th><th class="text-end">Tổng tiền</th><th>Hoàn tiền mô phỏng</th>
            </tr>
            </thead>
            <tbody id="payment-cases-body">
            <tr th:each="c : ${cases.content}" th:attr="data-order-id=${c.orderId},data-order-status=${c.orderStatus}">
                <td><a th:href="@{/admin/payments/{id}(id=${c.orderId})}" th:text="'#' + ${c.orderId}"></a></td>
                <td><span th:text="${c.customerName}"></span><br><span class="small text-secondary" th:text="${c.customerEmail}"></span></td>
                <td><span th:replace="~{fragments/components :: paymentCategory(${c.category})}"></span></td>
                <td><span th:replace="~{staff/delivery/fragments :: state(${c.orderStatus})}"></span></td>
                <td><span th:replace="~{staff/delivery/fragments :: payment(${c.paymentStatus})}"></span></td>
                <td><span th:replace="~{fragments/components :: gatewayAnswer(${c.verification})}"></span></td>
                <td th:text="${c.paymentDeadline != null} ? ${#temporals.format(c.paymentDeadline, 'dd/MM/yyyy HH:mm')} : '—'"></td>
                <td th:text="${c.reconciliationDeadline != null} ? ${#temporals.format(c.reconciliationDeadline, 'dd/MM/yyyy HH:mm')} : '—'"></td>
                <td class="text-end"><span th:replace="~{fragments/components :: price(${c.totalAmount})}"></span></td>
                <td><span th:replace="~{fragments/components :: refundStatus(${c.refundStatus})}"></span></td>
            </tr>
            <tr th:if="${cases.content.isEmpty()}"><td colspan="10" class="text-center text-secondary py-4">Không có đơn nào trong mục này.</td></tr>
            </tbody>
        </table>
    </div>

    <nav class="d-flex justify-content-center gap-3 mt-3" th:if="${cases.totalPages > 1}" aria-label="Phân trang">
        <a class="btn btn-outline-secondary" th:if="${cases.hasPrevious()}" th:href="@{/admin/payments(view=${view}, q=${q}, page=${cases.number - 1})}">Trang trước</a>
        <span class="align-self-center" th:text="'Trang ' + ${cases.number + 1} + ' / ' + ${cases.totalPages}"></span>
        <a class="btn btn-outline-secondary" th:if="${cases.hasNext()}" th:href="@{/admin/payments(view=${view}, q=${q}, page=${cases.number + 1})}">Trang sau</a>
    </nav>
</div>
</body>
</html>
