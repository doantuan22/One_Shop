
<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Phân công nhân viên</title>
    <style>
        body:has(form[action="/admin/staff-assignments"]) {
            --sa-primary: #FF7F50;
            --sa-primary-dark: #e86738;
            --sa-primary-soft: #fff5f2;
            --sa-primary-light: #ffede6;
            --sa-border: #f3e5df;
            --sa-text: #292d32;
            --sa-muted: #707780;
            --sa-surface: #ffffff;
        }

        body:has(form[action="/admin/staff-assignments"]) .btn {
            font-weight: 700;
            border-radius: 10px;
        }

        body:has(form[action="/admin/staff-assignments"]) > div:first-of-type {
            margin-bottom: 1.5rem;
        }

        body:has(form[action="/admin/staff-assignments"]) > div:first-of-type h1 {
            color: var(--sa-text);
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        body:has(form[action="/admin/staff-assignments"]) > .alert-success {
            padding: 0.9rem 1.25rem;
            margin-bottom: 1.25rem;
            border: 1px solid #cce8d3;
            border-radius: 12px;
            background-color: #f0faf2;
            color: #2e7d32;
            font-size: 0.9rem;
            font-weight: 600;
        }

        body:has(form[action="/admin/staff-assignments"]) > a.btn-outline-primary.mb-3 {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            padding: 0.65rem 1.15rem;
            margin-bottom: 1.5rem !important;
            border: 1px solid var(--sa-primary) !important;
            background-color: var(--sa-surface) !important;
            color: var(--sa-primary-dark) !important;
            font-size: 0.9rem;
            text-decoration: none;
        }

        body:has(form[action="/admin/staff-assignments"]) > a.btn-outline-primary.mb-3:hover {
            border-color: var(--sa-primary) !important;
            background-color: var(--sa-primary) !important;
            color: #ffffff !important;
        }

        body:has(form[action="/admin/staff-assignments"]) form.card.card-body.mb-4 {
            margin-bottom: 1.75rem !important;
            padding: 1.5rem;
            border: 1px solid var(--sa-border);
            border-radius: 14px;
            background-color: var(--sa-surface);
            box-shadow: 0 4px 20px rgba(42, 45, 50, 0.04);
        }

        body:has(form[action="/admin/staff-assignments"]) form.card .row {
            align-items: end;
        }

        body:has(form[action="/admin/staff-assignments"]) form.card .form-label {
            margin-bottom: 0.55rem;
            color: var(--sa-text);
            font-size: 0.9rem;
            font-weight: 700;
        }

        body:has(form[action="/admin/staff-assignments"]) form.card .form-select {
            min-height: 46px;
            padding: 0.7rem 2.25rem 0.7rem 0.95rem;
            border: 1px solid #e7dedb;
            border-radius: 10px;
            background-color: #ffffff;
            color: var(--sa-text);
            font-size: 0.9rem;
            box-shadow: none;
        }

        body:has(form[action="/admin/staff-assignments"]) form.card .form-select:focus {
            border-color: var(--sa-primary) !important;
            outline: none;
            box-shadow: 0 0 0 0.2rem rgba(255, 127, 80, 0.15) !important;
        }

        body:has(form[action="/admin/staff-assignments"]) form.card .btn-primary {
            min-height: 44px;
            padding: 0.7rem 1.35rem;
            border: 1px solid var(--sa-primary) !important;
            background-color: var(--sa-primary) !important;
            color: #ffffff !important;
            font-size: 0.9rem;
        }

        body:has(form[action="/admin/staff-assignments"]) form.card .btn-primary:hover {
            border-color: var(--sa-primary-dark) !important;
            background-color: var(--sa-primary-dark) !important;
        }

        body:has(form[action="/admin/staff-assignments"]) form.card > p.small {
            margin-top: 1rem !important;
            padding: 0.85rem 1rem;
            border: 1px solid #f8e6dc;
            border-radius: 9px;
            background-color: var(--sa-primary-soft);
            color: var(--sa-muted) !important;
            font-size: 0.825rem;
            line-height: 1.65;
        }

        body:has(form[action="/admin/staff-assignments"]) form.card .alert-danger {
            padding: 1rem 1.25rem;
            margin-bottom: 1.25rem;
            border: 1px solid #f5c6c6;
            border-radius: 10px;
            background-color: #fff2f2;
            color: #b71c1c;
            font-size: 0.875rem;
        }

        body:has(form[action="/admin/staff-assignments"]) form.card .alert-danger ul {
            margin-bottom: 0;
            padding-left: 1.25rem;
        }

        body:has(form[action="/admin/staff-assignments"]) form.card .alert-danger li + li {
            margin-top: 0.3rem;
        }

        body:has(form[action="/admin/staff-assignments"]) > form:not(.card) {
            margin-bottom: 1.5rem;
            padding: 1.15rem 1.25rem;
            border: 1px solid var(--sa-border);
            border-radius: 12px;
            background-color: var(--sa-surface);
        }

        body:has(form[action="/admin/staff-assignments"]) > form:not(.card) .form-label {
            margin-bottom: 0.5rem;
            color: var(--sa-text);
            font-size: 0.875rem;
            font-weight: 700;
        }

        body:has(form[action="/admin/staff-assignments"]) > form:not(.card) .form-select,
        body:has(form[action="/admin/staff-assignments"]) > form:not(.card) .form-control {
            min-height: 42px;
            border: 1px solid #e7dedb;
            border-radius: 9px;
            background-color: #ffffff;
            color: var(--sa-text);
        }

        body:has(form[action="/admin/staff-assignments"]) > form:not(.card) .form-select:focus,
        body:has(form[action="/admin/staff-assignments"]) > form:not(.card) .form-control:focus {
            border-color: var(--sa-primary) !important;
            box-shadow: 0 0 0 0.2rem rgba(255, 127, 80, 0.15) !important;
        }

        body:has(form[action="/admin/staff-assignments"]) > form:not(.card) .btn-primary {
            border-color: var(--sa-primary) !important;
            background-color: var(--sa-primary) !important;
            color: #ffffff !important;
        }

        body:has(form[action="/admin/staff-assignments"]) > form:not(.card) .btn-primary:hover {
            border-color: var(--sa-primary-dark) !important;
            background-color: var(--sa-primary-dark) !important;
        }

        body:has(form[action="/admin/staff-assignments"]) > .table-responsive {
            margin-bottom: 1.25rem;
            border: 1px solid var(--sa-border);
            border-radius: 14px;
            background-color: var(--sa-surface);
            box-shadow: 0 4px 20px rgba(42, 45, 50, 0.04);
            overflow-x: auto;
        }

        body:has(form[action="/admin/staff-assignments"]) .table {
            width: 100%;
            margin-bottom: 0;
            border-color: var(--sa-border);
            vertical-align: middle;
        }

        body:has(form[action="/admin/staff-assignments"]) .table thead th {
            padding: 1rem 1.15rem;
            border-bottom: 2px solid #ffd5c7;
            background-color: var(--sa-primary-soft);
            color: #bf360c;
            font-size: 0.85rem;
            font-weight: 700;
            white-space: nowrap;
            vertical-align: middle;
        }

        body:has(form[action="/admin/staff-assignments"]) .table tbody td {
            padding: 1rem 1.15rem;
            border-bottom: 1px solid var(--sa-border);
            color: var(--sa-text);
            font-size: 0.9rem;
            line-height: 1.6;
            vertical-align: middle;
        }

        body:has(form[action="/admin/staff-assignments"]) .table tbody tr:last-child td {
            border-bottom: 0;
        }

        body:has(form[action="/admin/staff-assignments"]) .table tbody tr {
            --sa-row-index: 0;
            animation: saStaggerTableRow 0.4s ease-out both;
            animation-delay: calc(0.08s + var(--sa-row-index) * 0.05s);
        }

        body:has(form[action="/admin/staff-assignments"]) .table tbody tr:nth-child(1) {
            --sa-row-index: 0;
        }

        body:has(form[action="/admin/staff-assignments"]) .table tbody tr:nth-child(2) {
            --sa-row-index: 1;
        }

        body:has(form[action="/admin/staff-assignments"]) .table tbody tr:nth-child(3) {
            --sa-row-index: 2;
        }

        body:has(form[action="/admin/staff-assignments"]) .table tbody tr:nth-child(4) {
            --sa-row-index: 3;
        }

        body:has(form[action="/admin/staff-assignments"]) .table tbody tr:nth-child(5) {
            --sa-row-index: 4;
        }

        body:has(form[action="/admin/staff-assignments"]) .table tbody tr:nth-child(6) {
            --sa-row-index: 5;
        }

        body:has(form[action="/admin/staff-assignments"]) .table tbody tr:nth-child(7) {
            --sa-row-index: 6;
        }

        body:has(form[action="/admin/staff-assignments"]) .table tbody tr:nth-child(8) {
            --sa-row-index: 7;
        }

        body:has(form[action="/admin/staff-assignments"]) .table tbody tr:nth-child(9) {
            --sa-row-index: 8;
        }

        body:has(form[action="/admin/staff-assignments"]) .table tbody tr:nth-child(10) {
            --sa-row-index: 9;
        }

        body:has(form[action="/admin/staff-assignments"]) .table tbody tr:nth-child(n+11) {
            --sa-row-index: 10;
        }

        @keyframes saStaggerTableRow {
            from {
                opacity: 0;
                transform: translateX(-12px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        body:has(form[action="/admin/staff-assignments"]) .table tbody tr:hover td {
            --bs-table-bg-state: #fffaf8;
        }

        body:has(form[action="/admin/staff-assignments"]) .table tbody td:first-child {
            min-width: 210px;
        }

        body:has(form[action="/admin/staff-assignments"]) .table tbody td:first-child > span {
            color: var(--sa-text);
            font-weight: 700;
        }

        body:has(form[action="/admin/staff-assignments"]) .table tbody td:first-child .small {
            margin-top: 0.35rem;
            color: var(--sa-muted) !important;
            font-size: 0.8rem;
            overflow-wrap: anywhere;
        }

        body:has(form[action="/admin/staff-assignments"]) .table tbody td:nth-child(2) {
            min-width: 170px;
        }

        body:has(form[action="/admin/staff-assignments"]) .table tbody td:nth-child(2) > span {
            font-weight: 700;
        }

        body:has(form[action="/admin/staff-assignments"]) .table tbody td:nth-child(2) .small {
            margin-top: 0.3rem;
            color: var(--sa-muted);
            font-size: 0.8rem;
        }

        body:has(form[action="/admin/staff-assignments"]) .table tbody td:nth-child(3) {
            min-width: 165px;
            color: var(--sa-muted);
            font-size: 0.85rem;
            font-variant-numeric: tabular-nums;
        }

        body:has(form[action="/admin/staff-assignments"]) .table tbody td:nth-child(4) {
            min-width: 115px;
            color: var(--sa-primary-dark);
            font-size: 0.85rem;
            font-weight: 800;
        }

        body:has(form[action="/admin/staff-assignments"]) .table tbody tr[data-assignment-id]:has(
            input[name="status"][value="ACTIVE"]
        ) td:nth-child(4) {
            color: var(--sa-muted);
        }

        body:has(form[action="/admin/staff-assignments"]) .table tbody td:nth-child(5) {
            min-width: 145px;
            text-align: right;
        }

        body:has(form[action="/admin/staff-assignments"]) .table tbody td:nth-child(5) .btn-outline-primary {
            min-height: 36px;
            padding: 0.45rem 0.8rem;
            border: 1px solid var(--sa-primary) !important;
            border-radius: 8px;
            background-color: #ffffff !important;
            color: var(--sa-primary-dark) !important;
            font-size: 0.8rem;
            font-weight: 700;
            white-space: nowrap;
        }

        body:has(form[action="/admin/staff-assignments"]) .table tbody td:nth-child(5) .btn-outline-primary:hover {
            border-color: var(--sa-primary) !important;
            background-color: var(--sa-primary) !important;
            color: #ffffff !important;
        }

        body:has(form[action="/admin/staff-assignments"]) .table tbody td[colspan="5"] {
            padding: 3rem 1rem !important;
            color: var(--sa-muted);
            font-size: 0.95rem;
            font-weight: 500;
            text-align: center;
        }

        body:has(form[action="/admin/staff-assignments"]) nav .pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-top: 1.5rem;
        }

        body:has(form[action="/admin/staff-assignments"]) nav .page-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 40px;
            min-height: 40px;
            padding: 0.5rem 0.9rem;
            border: 1px solid var(--sa-border);
            border-radius: 9px;
            background-color: #ffffff;
            color: var(--sa-primary);
            font-size: 0.875rem;
            font-weight: 700;
            box-shadow: none;
        }

        body:has(form[action="/admin/staff-assignments"]) nav .page-link:hover {
            border-color: var(--sa-primary);
            background-color: var(--sa-primary-soft);
            color: var(--sa-primary-dark);
        }

        body:has(form[action="/admin/staff-assignments"]) nav .page-item.active .page-link {
            border-color: var(--sa-primary) !important;
            background-color: var(--sa-primary) !important;
            color: #ffffff !important;
        }

        body:has(form[action="/admin/staff-assignments"]) nav .page-item.disabled .page-link {
            border-color: #eee7e4;
            background-color: #faf8f7;
            color: #a0a5ac;
            opacity: 1;
        }

        body:has(form[action="/admin/staff-assignments"]) a:focus-visible,
        body:has(form[action="/admin/staff-assignments"]) button:focus-visible {
            outline: 3px solid rgba(255, 127, 80, 0.4);
            outline-offset: 3px;
        }

        @media (max-width: 991.98px) {
            body:has(form[action="/admin/staff-assignments"]) form.card.card-body.mb-4 {
                padding: 1.25rem;
            }

            body:has(form[action="/admin/staff-assignments"]) .table thead th,
            body:has(form[action="/admin/staff-assignments"]) .table tbody td {
                padding: 0.85rem 0.9rem;
                font-size: 0.85rem;
            }
        }

        @media (max-width: 767.98px) {
            body:has(form[action="/admin/staff-assignments"]) > div:first-of-type {
                margin-bottom: 1.25rem;
            }

            body:has(form[action="/admin/staff-assignments"]) form.card.card-body.mb-4 {
                padding: 1rem;
                border-radius: 12px;
            }

            body:has(form[action="/admin/staff-assignments"]) form.card .row {
                row-gap: 1rem;
            }

            body:has(form[action="/admin/staff-assignments"]) form.card .btn-primary {
                width: 100%;
            }

            body:has(form[action="/admin/staff-assignments"]) > form:not(.card) {
                padding: 1rem;
            }

            body:has(form[action="/admin/staff-assignments"]) > .table-responsive {
                border-radius: 12px;
            }

            body:has(form[action="/admin/staff-assignments"]) .table thead th,
            body:has(form[action="/admin/staff-assignments"]) .table tbody td {
                padding: 0.8rem 0.7rem;
                font-size: 0.8rem;
            }

            body:has(form[action="/admin/staff-assignments"]) nav .page-link {
                min-width: 36px;
                min-height: 36px;
                padding: 0.45rem 0.7rem;
                font-size: 0.8rem;
            }
        }

        @media (max-width: 375px) {
            body:has(form[action="/admin/staff-assignments"]) > a.btn-outline-primary.mb-3 {
                width: 100%;
            }

            body:has(form[action="/admin/staff-assignments"]) nav .pagination {
                gap: 0.25rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            body:has(form[action="/admin/staff-assignments"]) .table tbody tr {
                animation: none !important;
                opacity: 1 !important;
                transform: none !important;
            }
        }
    </style>
</head>
<body>
<div th:replace="~{fragments/components :: pageHeader('Phân công nhân viên', 'Một nhân viên có thể làm việc tại nhiều chi nhánh. Bỏ phân công bằng trạng thái INACTIVE.')}"></div>
<div class="alert alert-success" th:if="${param.success}">Đã lưu phân công.</div>
<a th:href="@{/admin/users/new}" class="btn btn-outline-primary mb-3">Tạo Staff mới</a>
<form th:object="${form}" th:action="@{/admin/staff-assignments}" method="post" class="card card-body mb-4">
    <div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}">
        <ul>
            <li th:each="e : ${#fields.allErrors()}" th:text="${e}"></li>
        </ul>
    </div>
    <div class="row g-2">
        <div class="col-md-5">
            <label for="userId" class="form-label">Nhân viên</label>
            <select id="userId" th:field="*{userId}" class="form-select" required>
                <option value="">Chọn nhân viên</option>
                <option th:each="u : ${staff}" th:value="${u.id}" th:text="${u.fullName} + ' · ' + ${u.email} + ' · ' + ${u.status}"></option>
            </select>
        </div>
        <div class="col-md-4">
            <label for="storeId" class="form-label">Chi nhánh</label>
            <select id="storeId" th:field="*{storeId}" class="form-select" required>
                <option value="">Chọn chi nhánh</option>
                <option th:each="s : ${stores}" th:value="${s.id}" th:text="${s.name} + ' · ' + ${s.status}"></option>
            </select>
        </div>
        <div class="col-md-3">
            <label for="status" class="form-label">Phân công</label>
            <select id="status" th:field="*{status}" class="form-select">
                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
            </select>
        </div>
    </div>
    <div class="mt-3">
        <button class="btn btn-primary">Gán / cập nhật phân công</button>
    </div>
    <p class="small text-secondary mt-2 mb-0">Chuyển chi nhánh: bỏ phân công cũ rồi gán chi nhánh mới. Gán lại cùng nhân viên và chi nhánh sử dụng lại bản ghi hiện có.</p>
</form>
<form th:replace="~{admin/fragments :: storeFilter('/admin/staff-assignments')}"></form>
<div class="table-responsive">
    <table class="table table-hover">
        <thead>
        <tr>
            <th>Nhân viên</th>
            <th>Chi nhánh</th>
            <th>Ngày phân công</th>
            <th>Trạng thái</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="a : ${assignments.content}" th:attr="data-assignment-id=${a.id}">
            <td>
                <span th:text="${a.staff.fullName}"></span>
                <div class="small text-secondary" th:text="${a.staff.email} + ' · ' + ${a.staff.role} + ' · ' + ${a.staff.status}"></div>
            </td>
            <td>
                <span th:text="${a.store.name}"></span>
                <div class="small" th:text="${a.store.status}"></div>
            </td>
            <td th:text="${#temporals.format(a.assignedAt, 'dd/MM/yyyy HH:mm')}"></td>
            <td th:text="${a.status}"></td>
            <td>
                <form th:action="@{/admin/staff-assignments/{id}/status(id=${a.id})}" method="post">
                    <input type="hidden" name="status" th:value="${a.status.name() == 'ACTIVE'} ? 'INACTIVE' : 'ACTIVE'">
                    <button class="btn btn-sm btn-outline-primary" th:text="${a.status.name() == 'ACTIVE'} ? 'Bỏ phân công' : 'Bật lại'"></button>
                </form>
            </td>
        </tr>
        <tr th:if="${assignments.empty}">
            <td colspan="5">Chưa có phân công.</td>
        </tr>
        </tbody>
    </table>
</div>
<nav th:replace="~{admin/fragments :: pagination(${assignments}, '/admin/staff-assignments', 'storeId', ${storeId})}"></nav>
</body>
</html>
