<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><title>Phân công nhân viên</title></head><body>
<div th:replace="~{fragments/components :: pageHeader('Phân công nhân viên', 'Một nhân viên có thể làm việc tại nhiều chi nhánh. Bỏ phân công bằng trạng thái INACTIVE.')}"></div>
<div class="alert alert-success" th:if="${param.success}">Đã lưu phân công.</div>
<a th:href="@{/admin/users/new}" class="btn btn-outline-primary mb-3">Tạo Staff mới</a>
<form th:object="${form}" th:action="@{/admin/staff-assignments}" method="post" class="card card-body mb-4">
    <div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}"><ul><li th:each="e : ${#fields.allErrors()}" th:text="${e}"></li></ul></div>
    <div class="row g-2"><div class="col-md-5"><label for="userId" class="form-label">Nhân viên</label>
        <select id="userId" th:field="*{userId}" class="form-select" required><option value="">Chọn nhân viên</option>
            <option th:each="u : ${staff}" th:value="${u.id}" th:text="${u.fullName} + ' · ' + ${u.email} + ' · ' + ${u.status}"></option></select></div>
        <div class="col-md-4"><label for="storeId" class="form-label">Chi nhánh</label><select id="storeId" th:field="*{storeId}" class="form-select" required><option value="">Chọn chi nhánh</option>
            <option th:each="s : ${stores}" th:value="${s.id}" th:text="${s.name} + ' · ' + ${s.status}"></option></select></div>
        <div class="col-md-3"><label for="status" class="form-label">Phân công</label><select id="status" th:field="*{status}" class="form-select"><option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option></select></div>
    </div><div class="mt-3"><button class="btn btn-primary">Gán / cập nhật phân công</button></div>
    <p class="small text-secondary mt-2 mb-0">Chuyển chi nhánh: bỏ phân công cũ rồi gán chi nhánh mới. Gán lại cùng nhân viên và chi nhánh sử dụng lại bản ghi hiện có.</p>
</form>
<form th:replace="~{admin/fragments :: storeFilter('/admin/staff-assignments')}"></form>
<div class="table-responsive"><table class="table table-hover"><thead><tr><th>Nhân viên</th><th>Chi nhánh</th><th>Ngày phân công</th><th>Trạng thái</th><th></th></tr></thead>
<tbody><tr th:each="a : ${assignments.content}" th:attr="data-assignment-id=${a.id}">
    <td><span th:text="${a.staff.fullName}"></span><div class="small text-secondary" th:text="${a.staff.email} + ' · ' + ${a.staff.role} + ' · ' + ${a.staff.status}"></div></td>
    <td><span th:text="${a.store.name}"></span><div class="small" th:text="${a.store.status}"></div></td>
    <td th:text="${#temporals.format(a.assignedAt, 'dd/MM/yyyy HH:mm')}"></td>
    <td th:text="${a.status}"></td><td><form th:action="@{/admin/staff-assignments/{id}/status(id=${a.id})}" method="post">
        <input type="hidden" name="status" th:value="${a.status.name() == 'ACTIVE'} ? 'INACTIVE' : 'ACTIVE'">
        <button class="btn btn-sm btn-outline-primary" th:text="${a.status.name() == 'ACTIVE'} ? 'Bỏ phân công' : 'Bật lại'"></button></form></td>
</tr><tr th:if="${assignments.empty}"><td colspan="5">Chưa có phân công.</td></tr></tbody></table></div>
<nav th:replace="~{admin/fragments :: pagination(${assignments}, '/admin/staff-assignments', 'storeId', ${storeId})}"></nav>
</body></html>
