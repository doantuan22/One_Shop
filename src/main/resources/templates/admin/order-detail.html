<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Chi tiết đơn hàng</title>
    <style>
        body:has(a[href*="/admin/orders"]) {
            --od-primary: #FF7F50;
            --od-primary-dark: #e86738;
            --od-primary-soft: #fff5f2;
            --od-primary-light: #ffede6;
            --od-border: #f3e5df;
            --od-text: #292d32;
            --od-muted: #707780;
            --od-surface: #ffffff;
        }

        @keyframes odFadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        body:has(a[href*="/admin/orders"]) a.btn-outline-secondary.mb-3 {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            padding: 0.65rem 1.15rem;
            margin-bottom: 1.5rem !important;
            border: 1px solid var(--od-border) !important;
            border-radius: 10px;
            background-color: var(--od-surface) !important;
            color: var(--od-text) !important;
            font-size: 0.9rem;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 2px 8px rgba(42, 45, 50, 0.04);
            transition:
                transform 0.22s ease,
                background-color 0.22s ease,
                border-color 0.22s ease,
                color 0.22s ease,
                box-shadow 0.22s ease;
        }

        body:has(a[href*="/admin/orders"]) a.btn-outline-secondary.mb-3:hover {
            transform: translateY(-2px);
            border-color: var(--od-primary) !important;
            background-color: var(--od-primary-soft) !important;
            color: var(--od-primary-dark) !important;
            box-shadow: 0 6px 16px rgba(255, 127, 80, 0.14);
        }

        body:has(a[href*="/admin/orders"]) a.btn-outline-secondary.mb-3:active {
            transform: translateY(0);
        }

        body:has(a[href*="/admin/orders"]) a.btn-outline-secondary.mb-3:focus-visible {
            outline: 3px solid rgba(255, 127, 80, 0.35);
            outline-offset: 3px;
        }

        body:has(a[href*="/admin/orders"]) p:has(> span:first-child) {
            margin-bottom: 1.5rem;
            padding: 1.25rem 1.5rem;
            border: 1px solid var(--od-border);
            border-left: 4px solid var(--od-primary);
            border-radius: 12px;
            background-color: var(--od-surface);
            color: var(--od-muted);
            font-size: 0.925rem;
            line-height: 1.8;
            overflow-wrap: anywhere;
            box-shadow: 0 3px 14px rgba(42, 45, 50, 0.03);
            animation: odFadeUp 0.4s ease-out both;
        }

        body:has(a[href*="/admin/orders"]) p:has(> span:first-child)>span {
            color: var(--od-text);
            font-weight: 700;
        }

        body:has(a[href*="/admin/orders"]) p:has(> span:first-child)>span:first-child {
            color: var(--od-primary-dark);
            font-weight: 800;
            font-variant-numeric: tabular-nums;
        }

        body:has(a[href*="/admin/orders"]) h1.h3 {
            margin-bottom: 0.75rem;
            color: var(--od-text);
            font-size: 1.65rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            animation: odFadeUp 0.4s ease-out both;
        }

        body:has(a[href*="/admin/orders"]) h1.h3+p {
            margin-bottom: 0.35rem;
            color: var(--od-text);
            font-size: 0.95rem;
            font-weight: 700;
        }

        body:has(a[href*="/admin/orders"]) h1.h3+p+p {
            margin-bottom: 1.5rem;
            color: var(--od-muted) !important;
            font-size: 0.875rem;
            line-height: 1.6;
        }

        body:has(a[href*="/admin/orders"]) dl.row {
            margin: 0 0 1.75rem;
            padding: 1.5rem;
            border: 1px solid var(--od-border);
            border-radius: 14px;
            background-color: var(--od-surface);
            box-shadow: 0 4px 18px rgba(42, 45, 50, 0.04);
            animation: odFadeUp 0.4s ease-out 0.08s both;
        }

        body:has(a[href*="/admin/orders"]) dl.row dt,
        body:has(a[href*="/admin/orders"]) dl.row dd {
            padding-top: 0.7rem;
            padding-bottom: 0.7rem;
            margin-bottom: 0;
            border-bottom: 1px solid var(--od-border);
            font-size: 0.9rem;
            line-height: 1.6;
        }

        body:has(a[href*="/admin/orders"]) dl.row dt {
            color: var(--od-muted);
            font-weight: 600;
        }

        body:has(a[href*="/admin/orders"]) dl.row dd {
            color: var(--od-text);
            font-weight: 700;
            overflow-wrap: anywhere;
        }

        body:has(a[href*="/admin/orders"]) dl.row dt:nth-last-of-type(1),
        body:has(a[href*="/admin/orders"]) dl.row dd:nth-last-of-type(1) {
            border-bottom: 0;
        }

        body:has(a[href*="/admin/orders"]) #order-payment-status,
        body:has(a[href*="/admin/orders"]) #order-status {
            font-weight: 700;
        }

        body:has(a[href*="/admin/orders"]) .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.4rem 0.75rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 700;
            line-height: 1.4;
            white-space: nowrap;
        }

        body:has(a[href*="/admin/orders"]) .alert-info {
            margin-bottom: 1.75rem;
            padding: 1.25rem 1.5rem;
            border: 1px solid #ffd5c7;
            border-left: 4px solid var(--od-primary);
            border-radius: 12px;
            background-color: var(--od-primary-soft);
            color: #bf360c;
            font-size: 0.9rem;
            line-height: 1.6;
            animation: odFadeUp 0.4s ease-out 0.12s both;
        }

        body:has(a[href*="/admin/orders"]) #pickup-code {
            display: inline-block;
            margin-left: 0.5rem;
            color: var(--od-primary-dark);
            font-weight: 800;
            letter-spacing: 0.08em;
        }

        body:has(a[href*="/admin/orders"]) h2.h5 {
            display: flex;
            align-items: center;
            margin-top: 1.75rem;
            margin-bottom: 1rem;
            padding-left: 0.85rem;
            border-left: 4px solid var(--od-primary);
            color: var(--od-text);
            font-size: 1.1rem;
            font-weight: 800;
            line-height: 1.5;
            transition:
                border-color 0.2s ease,
                padding-left 0.2s ease,
                color 0.2s ease;
        }

        body:has(a[href*="/admin/orders"]) h2.h5:hover {
            padding-left: 1.1rem;
            border-left-color: var(--od-primary-dark);
            color: var(--od-primary-dark);
        }

        body:has(a[href*="/admin/orders"]) .table-responsive {
            margin-bottom: 1rem;
            border: 1px solid var(--od-border);
            border-radius: 12px;
            background-color: var(--od-surface);
            overflow-x: auto;
            animation: odFadeUp 0.4s ease-out 0.14s both;
        }

        body:has(a[href*="/admin/orders"]) .table {
            width: 100%;
            margin-bottom: 0;
            border-color: var(--od-border);
            vertical-align: middle;
        }

        body:has(a[href*="/admin/orders"]) .table thead th {
            padding: 1rem 1.1rem;
            border-bottom: 2px solid #ffd5c7;
            background-color: var(--od-primary-soft);
            color: #bf360c;
            font-size: 0.85rem;
            font-weight: 700;
            white-space: nowrap;
        }

        body:has(a[href*="/admin/orders"]) .table tbody td {
            padding: 1rem 1.1rem;
            border-bottom: 1px solid var(--od-border);
            background-color: var(--od-surface);
            color: var(--od-text);
            font-size: 0.9rem;
            line-height: 1.6;
            vertical-align: middle;
        }

        body:has(a[href*="/admin/orders"]) .table tbody tr:nth-child(even) td {
            background-color: #fffaf8;
        }

        body:has(a[href*="/admin/orders"]) .table tbody tr:last-child td {
            border-bottom: 0;
        }

        body:has(a[href*="/admin/orders"]) .table thead th:not(:first-child),
        body:has(a[href*="/admin/orders"]) .table tbody td:not(:first-child) {
            text-align: right;
        }

        body:has(a[href*="/admin/orders"]) .table tbody td:first-child {
            font-weight: 600;
        }

        body:has(a[href*="/admin/orders"]) .table tbody td:last-child {
            font-weight: 800;
            white-space: nowrap;
        }

        body:has(a[href*="/admin/orders"]) .table tbody td:nth-child(2),
        body:has(a[href*="/admin/orders"]) .table tbody td:nth-child(4) {
            font-variant-numeric: tabular-nums;
        }

        body:has(a[href*="/admin/orders"]) .table-responsive+p.fw-bold {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1.75rem;
            padding: 1rem 1.25rem;
            border: 1px solid var(--od-border);
            border-radius: 10px;
            background-color: var(--od-primary-soft);
            color: var(--od-text);
            font-size: 1rem;
            font-weight: 800 !important;
        }

        body:has(a[href*="/admin/orders"]) .table-responsive+p.fw-bold span {
            color: var(--od-primary-dark);
            font-size: 1.1rem;
            font-weight: 800;
        }

        body:has(a[href*="/admin/orders"]) .card.mb-2 {
            margin-bottom: 0.75rem !important;
            border: 1px solid var(--od-border);
            border-radius: 12px;
            background-color: var(--od-surface);
            box-shadow: 0 3px 12px rgba(42, 45, 50, 0.03);
            overflow: hidden;
        }

        body:has(a[href*="/admin/orders"]) .card.mb-2 .card-body {
            padding: 1.15rem 1.25rem;
            color: var(--od-text);
            font-size: 0.9rem;
            font-weight: 600;
            line-height: 1.7;
        }

        body:has(a[href*="/admin/orders"]) .card.mb-2 .small {
            margin-top: 0.35rem;
            color: var(--od-muted);
            font-size: 0.8rem;
            font-weight: 500;
        }

        body:has(a[href*="/admin/orders"]) ol.list-group {
            margin-bottom: 2rem;
            border: 1px solid var(--od-border);
            border-radius: 12px;
            background-color: var(--od-surface);
            overflow: hidden;
        }

        body:has(a[href*="/admin/orders"]) ol.list-group .list-group-item {
            position: relative;
            padding: 1.15rem 1.25rem 1.15rem 2.75rem;
            border: 0;
            border-bottom: 1px solid var(--od-border);
            background-color: var(--od-surface);
            color: var(--od-text);
            font-size: 0.9rem;
            line-height: 1.7;
        }

        body:has(a[href*="/admin/orders"]) ol.list-group .list-group-item:last-child {
            border-bottom: 0;
        }

        body:has(a[href*="/admin/orders"]) ol.list-group .list-group-item:nth-child(even) {
            background-color: #fffaf8;
        }

        body:has(a[href*="/admin/orders"]) ol.list-group-numbered>.list-group-item::before {
            position: absolute;
            top: 1.15rem;
            left: 1.15rem;
            color: var(--od-primary-dark);
            font-size: 0.9rem;
            font-weight: 800;
        }

        body:has(a[href*="/admin/orders"]) ol.list-group .list-group-item>span {
            font-weight: 700;
        }

        body:has(a[href*="/admin/orders"]) ol.list-group .list-group-item .small {
            margin-top: 0.4rem;
            color: var(--od-muted);
            font-size: 0.8rem;
            line-height: 1.6;
        }

        body:has(a[href*="/admin/orders"]) ol.list-group .list-group-item .small.text-secondary {
            color: #8b929b !important;
            font-style: italic;
        }

        body:has(a[href*="/admin/orders"]) a:focus-visible {
            outline: 3px solid rgba(255, 127, 80, 0.4);
            outline-offset: 3px;
        }

        @media (max-width: 767.98px) {
            body:has(a[href*="/admin/orders"]) a.btn-outline-secondary.mb-3 {
                min-height: 40px;
                padding: 0.55rem 1rem;
                font-size: 0.85rem;
            }

            body:has(a[href*="/admin/orders"]) p:has(> span:first-child) {
                padding: 1rem;
                font-size: 0.85rem;
            }

            body:has(a[href*="/admin/orders"]) h1.h3 {
                font-size: 1.4rem;
            }

            body:has(a[href*="/admin/orders"]) dl.row {
                padding: 1rem;
            }

            body:has(a[href*="/admin/orders"]) dl.row dt,
            body:has(a[href*="/admin/orders"]) dl.row dd {
                padding-top: 0.5rem;
                padding-bottom: 0.5rem;
                font-size: 0.85rem;
            }

            body:has(a[href*="/admin/orders"]) dl.row dd {
                padding-left: 1rem;
            }

            body:has(a[href*="/admin/orders"]) .table thead th,
            body:has(a[href*="/admin/orders"]) .table tbody td {
                padding: 0.8rem 0.7rem;
                font-size: 0.8rem;
            }

            body:has(a[href*="/admin/orders"]) .table-responsive+p.fw-bold {
                padding: 0.85rem 1rem;
                font-size: 0.9rem;
            }

            body:has(a[href*="/admin/orders"]) .card.mb-2 .card-body {
                padding: 1rem;
            }

            body:has(a[href*="/admin/orders"]) ol.list-group .list-group-item {
                padding: 1rem 1rem 1rem 2.5rem;
            }

            body:has(a[href*="/admin/orders"]) ol.list-group-numbered>.list-group-item::before {
                top: 1rem;
                left: 1rem;
            }
        }

        @media (max-width: 575.98px) {
            body:has(a[href*="/admin/orders"]) dl.row dt {
                padding-bottom: 0.15rem;
                border-bottom: 0;
            }

            body:has(a[href*="/admin/orders"]) dl.row dd {
                padding-top: 0.15rem;
                padding-left: 0;
            }

            body:has(a[href*="/admin/orders"]) .table-responsive+p.fw-bold {
                justify-content: flex-start;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            body:has(a[href*="/admin/orders"]) p:has(> span:first-child),
            body:has(a[href*="/admin/orders"]) h1.h3,
            body:has(a[href*="/admin/orders"]) dl.row,
            body:has(a[href*="/admin/orders"]) .alert-info,
            body:has(a[href*="/admin/orders"]) .table-responsive {
                animation: none !important;
                opacity: 1 !important;
                transform: none !important;
            }

            body:has(a[href*="/admin/orders"]) a.btn-outline-secondary.mb-3,
            body:has(a[href*="/admin/orders"]) h2.h5 {
                transition: none !important;
            }

            body:has(a[href*="/admin/orders"]) a.btn-outline-secondary.mb-3:hover {
                transform: none !important;
            }

            body:has(a[href*="/admin/orders"]) h2.h5:hover {
                padding-left: 0.85rem;
            }
        }
    </style>
</head>

<body>
    <a class="btn btn-outline-secondary mb-3"
        th:href="@{/admin/orders(storeId=${orderDetail.detail.order.storeId})}">Đơn cùng chi nhánh</a>
    <p>Checkout #<span th:text="${orderDetail.checkoutId}"></span> · Khách hàng:
        <span th:text="${orderDetail.customerName}"></span> (<span th:text="${orderDetail.customerEmail}"></span>)
    </p>
    <div th:replace="~{orders/fragments :: detail(${orderDetail.detail})}"></div>
</body>

</html>
