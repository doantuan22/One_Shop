<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><title>Quản lý người dùng</title></head><body>
<nav class="os-breadcrumb-pill" aria-label="Vị trí trang"><a th:href="@{/admin/users}">Người dùng</a><span class="os-breadcrumb-sep" aria-hidden="true">/</span><strong th:text="${current == null} ? 'Thêm mới' : 'Chỉnh sửa'">Thêm mới</strong></nav>
<div th:replace="~{fragments/components :: pageHeader(${current == null} ? 'Tạo tài khoản' : 'Cập nhật người dùng', 'Quản lý tài khoản, vai trò và trạng thái hoạt động.')}"></div>
<section class="card shadow-sm">
    <div class="card-body">
        <form th:object="${form}" method="post" th:action="${current == null} ? @{/admin/users} : @{/admin/users/{id}(id=${current.id})}">
            <div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}"><ul class="mb-0"><li th:each="e : ${#fields.allErrors()}" th:text="${e}"></li></ul></div>
            <div class="row g-3">
                <div class="col-12 col-md-6">
                    <label for="email" class="form-label">Email</label>
                    <input id="email" type="email" class="form-control" th:field="*{email}" th:readonly="${current != null}" maxlength="255" required>
                </div>
                <div class="col-12 col-md-6">
                    <label for="userName" class="form-label">Tên đăng nhập</label>
                    <input id="userName" class="form-control" th:field="*{userName}" minlength="4" maxlength="30" pattern="[A-Za-z0-9_.]{4,30}" autocapitalize="none" spellcheck="false" autocomplete="off">
                    <div class="form-text">Không bắt buộc. 4-30 ký tự: chữ, số, dấu _ và dấu chấm (không chứa @). Dùng để đăng nhập thay email.</div>
                </div>
                <div class="col-12 col-md-6">
                    <label for="fullName" class="form-label">Họ tên</label>
                    <input id="fullName" class="form-control" th:field="*{fullName}" maxlength="150" required>
                </div>
                <div class="col-12 col-md-6">
                    <label for="phone" class="form-label">Điện thoại</label>
                    <input id="phone" class="form-control" th:field="*{phone}" maxlength="20">
                </div>
                <div class="col-12 col-md-6">
                    <label for="role" class="form-label">Vai trò</label>
                    <select id="role" th:field="*{role}" class="form-select">
                        <option th:each="r : ${roles}" th:value="${r}"
                                th:text="${r.name() == 'ADMIN'} ? 'Quản trị viên' : (${r.name() == 'STAFF'} ? 'Nhân viên' : 'Khách hàng')"></option>
                    </select>
                </div>
                <div class="col-12 col-md-6">
                    <label for="status" class="form-label">Trạng thái</label>
                    <select id="status" th:field="*{status}" class="form-select">
                        <option th:each="s : ${statuses}" th:value="${s}"
                                th:text="${s.name() == 'ACTIVE'} ? 'Đang hoạt động' : 'Ngừng hoạt động'"></option>
                    </select>
                </div>
                <div class="col-12 col-md-6" th:if="${current == null}">
                    <label for="password" class="form-label">Mật khẩu ban đầu</label>
                    <input id="password" name="password" type="password" class="form-control" minlength="8" maxlength="72" autocomplete="new-password" required>
                </div>
                <div class="col-12">
                    <p class="small text-secondary mb-0">Đổi Staff sang vai trò khác sẽ tắt các phân công hiện có. Email giữ nguyên sau khi tạo tài khoản.</p>
                </div>
            </div>
            <div class="d-flex gap-2 mt-4">
                <button class="btn btn-primary" type="submit">Lưu</button>
                <a class="btn btn-outline-secondary" th:href="@{/admin/users}">Quay lại</a>
            </div>
        </form>
    </div>
</section>
</body></html>
