<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><title>Đơn hàng toàn hệ thống</title></head><body>
<div th:replace="~{fragments/components :: pageHeader('Đơn hàng toàn hệ thống', 'Mỗi dòng là một đơn hàng. Lọc theo chi nhánh sẽ lấy các đơn có phần giao thuộc chi nhánh đó.')}"></div>
<form th:replace="~{admin/fragments :: storeFilter('/admin/orders')}"></form>
<div class="mb-3 d-flex flex-wrap gap-2" id="order-attention-filter">
    <a class="btn btn-sm" th:classappend="${!attention} ? 'btn-primary' : 'btn-outline-secondary'" th:href="@{/admin/orders(storeId=${storeId})}">Tất cả đơn</a>
    <a class="btn btn-sm" th:classappend="${attention} ? 'btn-primary' : 'btn-outline-secondary'" th:href="@{/admin/orders(storeId=${storeId}, attention=true)}">Cần Admin xử lý</a>
</div>
<div class="table-responsive"><table class="table table-hover align-middle os-table"><thead><tr><th>Mã đơn</th><th>Chi nhánh cấp hàng</th><th>Khách hàng</th><th>Hình thức nhận</th><th>Trạng thái đơn</th><th>Thanh toán</th><th class="text-end">Tổng tiền</th></tr></thead>
<tbody><tr th:each="row : ${orders.content}" th:with="o=${row.order}" th:attr="data-order-id=${o.orderId},data-store-id=${o.storeId}">
    <td><a th:href="@{/admin/orders/{id}(id=${o.orderId})}" th:text="'#' + ${o.orderId}"></a><div class="small text-secondary" th:text="${#temporals.format(o.createdAt, 'dd/MM/yyyy HH:mm')}"></div></td>
    <td th:text="${o.storeName}"></td><td><span th:text="${row.customerName}"></span><div class="small text-secondary" th:text="${row.customerEmail}"></div></td>
    <td><span th:replace="~{fragments/components :: fulfillmentType(${o.fulfillmentType})}"></span></td>
    <td><span th:replace="~{staff/delivery/fragments :: state(${o.orderStatus})}"></span></td>
    <td><span th:replace="~{staff/delivery/fragments :: method(${o.paymentMethod})}"></span><div class="small text-secondary"><span th:replace="~{staff/delivery/fragments :: payment(${o.paymentStatus})}"></span></div></td>
    <td class="text-end"><span th:replace="~{fragments/components :: price(${o.totalAmount})}"></span></td>
</tr><tr th:if="${orders.empty}"><td colspan="7" class="text-center text-secondary py-4">Chưa có đơn hàng nào.</td></tr></tbody></table></div>
<p>Tổng số: <strong id="order-count" th:text="${orders.totalElements}"></strong> đơn hàng</p>
<nav th:replace="~{admin/fragments :: pagination(${orders}, ${attention} ? '/admin/orders?attention=true' : '/admin/orders', 'storeId', ${storeId})}"></nav>
</body></html>
