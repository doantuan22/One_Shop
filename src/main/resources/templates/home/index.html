<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Trang chủ</title>
</head>
<body>
<section class="os-hero rounded-4 p-5 mb-4 text-center">
    <h1 class="display-5 fw-bold">Chào mừng đến với OneShop</h1>
    <p class="lead mb-4">Mỹ phẩm chính hãng, hệ thống cửa hàng trên toàn quốc.</p>
    <a class="btn btn-primary btn-lg" th:href="@{/products}">Xem sản phẩm</a>
</section>

<section aria-labelledby="stack-title">
    <h2 class="h5 mb-3" id="stack-title">Trạng thái hệ thống</h2>
    <div class="row g-3">
        <div class="col-6 col-md-3" th:each="tech : ${ {'Spring Boot', 'Thymeleaf', 'Bootstrap', 'SiteMesh'} }">
            <div class="card h-100 text-center">
                <div class="card-body">
                    <div class="fw-semibold" th:text="${tech}">Tech</div>
                    <span class="badge text-bg-success mt-2">Hoạt động</span>
                </div>
            </div>
        </div>
    </div>
    <p class="text-secondary small mt-3 mb-0">
        Trang này được Spring MVC render bằng Thymeleaf, định dạng bằng Bootstrap và được SiteMesh
        bọc trong layout chung (header, navbar, footer).
    </p>
</section>
</body>
</html>
