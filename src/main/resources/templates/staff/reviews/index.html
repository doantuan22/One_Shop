<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><title>Đánh giá của chi nhánh</title></head>
<body>
<div th:replace="~{fragments/components :: pageHeader('Đánh giá của chi nhánh', 'Đánh giá từ phần hàng đã giao của chi nhánh được phân công. Mỗi đánh giá có một phản hồi, có thể sửa lại.')}"></div>
<div class="alert alert-success" th:if="${param.replied}">Đã lưu phản hồi.</div>
<div class="alert alert-danger" th:if="${param.replyError}">Phản hồi phải có từ 1 đến 1000 ký tự.</div>
<p class="text-secondary">Tổng số đánh giá: <strong id="review-count" th:text="${reviews.totalElements}"></strong></p>
<div class="alert alert-secondary" th:if="${reviews.empty}">Chưa có đánh giá nào của chi nhánh.</div>
<div class="card shadow-sm mb-3" th:each="r : ${reviews.content}" th:attr="data-review-id=${r.id}">
    <div class="card-body">
        <div class="d-flex flex-wrap justify-content-between gap-2">
            <div>
                <a class="fw-semibold" th:href="@{/staff/reviews/{id}(id=${r.id})}" th:text="${r.productName}">Sản phẩm</a>
                <div class="small text-secondary"><span th:text="${r.sku}">SKU</span> &middot; <span th:text="${r.storeName}">Chi nhánh</span></div>
            </div>
            <div class="text-end">
                <div th:text="${r.rating} + ' / 5 sao'">5 / 5 sao</div>
                <span class="small" th:text="'Đơn #' + ${r.orderId}">Đơn</span>
                <a class="small d-block" th:if="${r.fulfillmentId != null}" th:href="@{/staff/fulfillments/{id}(id=${r.fulfillmentId})}"
                   th:text="'Phần giao #' + ${r.fulfillmentId}">Phần giao</a>
            </div>
        </div>
        <p class="mb-1 mt-2" style="white-space: pre-line" th:if="${r.comment}" th:text="${r.comment}">Nhận xét</p>
        <div class="small text-secondary">
            <span th:text="${r.customerName}">Khách</span> &middot;
            <span th:text="${#temporals.format(r.createdAt, 'dd/MM/yyyy HH:mm')}">01/01/2026 10:00</span>
        </div>
        <form class="mt-3" method="post" th:action="@{/staff/reviews/{id}/reply(id=${r.id})}">
            <input type="hidden" name="page" th:value="${reviews.number}">
            <label class="form-label small" th:for="'reply-' + ${r.id}"
                   th:text="${r.reply != null} ? 'Phản hồi hiện tại (có thể sửa)' : 'Phản hồi cho khách'">Phản hồi</label>
            <textarea class="form-control mb-2" th:id="'reply-' + ${r.id}" name="reply" rows="2" maxlength="1000"
                      required th:text="${r.reply}"></textarea>
            <div class="small text-secondary mb-2" th:if="${r.repliedAt != null}"
                 th:text="'Cập nhật lần cuối: ' + ${#temporals.format(r.repliedAt, 'dd/MM/yyyy HH:mm')}">Cập nhật</div>
            <button type="submit" class="btn btn-primary btn-sm" th:text="${r.reply != null} ? 'Cập nhật phản hồi' : 'Gửi phản hồi'">Gửi</button>
        </form>
    </div>
</div>
<nav aria-label="Phân trang đánh giá" class="d-flex align-items-center gap-3" th:if="${reviews.totalPages > 1}">
    <a class="btn btn-outline-secondary" th:if="${reviews.hasPrevious()}" th:href="@{/staff/reviews(page=${reviews.number - 1})}">Trang trước</a>
    <span th:text="'Trang ' + ${reviews.number + 1} + ' / ' + ${reviews.totalPages}"></span>
    <a class="btn btn-outline-secondary" th:if="${reviews.hasNext()}" th:href="@{/staff/reviews(page=${reviews.number + 1})}">Trang sau</a>
</nav>
</body></html>
