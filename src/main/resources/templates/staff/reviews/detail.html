<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><title>Chi tiết đánh giá</title></head><body>
<a class="btn btn-outline-secondary btn-sm mb-3" th:href="@{/staff/reviews}">Đánh giá của chi nhánh</a>
<div class="card shadow-sm" th:attr="data-review-id=${review.id},data-review-item=${review.orderItemId}">
    <div class="card-body">
        <h1 class="h5" th:text="${review.productName}">Sản phẩm</h1>
        <span class="badge" th:classappend="${review.reply != null} ? 'os-soft os-soft-success' : 'os-soft os-soft-warning'"
              th:text="${review.reply != null} ? 'Đã phản hồi' : 'Cần phản hồi'">Cần phản hồi</span>
        <div class="text-secondary small"><span th:text="${review.sku}">SKU</span> &middot; <span th:text="${review.storeName}">Chi nhánh</span></div>
        <p class="mt-2"><span th:text="${review.customerName}">Khách hàng</span> &middot; <span th:text="${review.rating} + ' / 5 sao'">5 sao</span></p>
        <p style="white-space: pre-line" th:text="${review.comment}">Nhận xét</p>
        <p class="small text-secondary mb-1">Dòng hàng #<span th:text="${review.orderItemId}">1</span> thuộc đơn #<span th:text="${review.orderId}">1</span>.
            Nội dung đánh giá của khách không thể chỉnh sửa.</p>
        <a th:if="${review.fulfillmentId != null}" th:href="@{/staff/fulfillments/{id}(id=${review.fulfillmentId})}" th:text="'Phần giao #' + ${review.fulfillmentId}">Phần giao</a>
        <form class="mt-3" method="post" th:action="@{/staff/reviews/{id}/reply(id=${review.id})}">
            <label class="form-label" for="reply">Phản hồi của chi nhánh</label>
            <textarea class="form-control mb-2" id="reply" name="reply" rows="3" maxlength="1000" required th:text="${review.reply}"></textarea>
            <p class="small text-secondary" th:if="${review.repliedAt != null}" th:text="'Cập nhật: ' + ${#temporals.format(review.repliedAt, 'dd/MM/yyyy HH:mm')}">Thời gian cập nhật</p>
            <button class="btn btn-primary" type="submit">Lưu phản hồi</button>
        </form>
    </div>
</div>
</body></html>
