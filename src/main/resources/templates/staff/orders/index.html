<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Danh sách đơn hàng</title>

    <style>
        /* ONESHOP - STAFF ORDER LIST */

        .os-staff-orders {
            --orders-primary: #FF7F50;
            --orders-primary-hover: #e86738;
            --orders-soft: #fff5f2;
            --orders-border: #ffd5c7;
            --orders-text: #2c3038;
        }

        .os-staff-orders .os-orders-panel {
            background: #ffffff;
            border: 1px solid var(--orders-border);
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 6px 22px rgba(255, 127, 80, 0.06);
        }

        .os-staff-orders .os-orders-count {
            display: inline-flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            background: var(--orders-soft);
            border: 1px solid var(--orders-border);
            border-radius: 12px;
            padding: 10px 16px;
            color: var(--orders-text);
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        .os-staff-orders .os-orders-count strong {
            color: var(--orders-primary-hover);
            font-size: 1.15rem;
            font-weight: 800;
        }

        .os-staff-orders .os-orders-table {
            width: 100%;
            overflow-x: auto;
            border: 1px solid #f3e5df;
            border-radius: 14px;
            background: #ffffff;
        }

        .os-staff-orders .os-orders-pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 14px;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #f3e5df;
        }

        .os-staff-orders .os-orders-pagination .btn {
            border-color: var(--orders-border);
            border-radius: 10px;
            color: var(--orders-primary-hover);
            background: #ffffff;
            font-weight: 600;
            padding: 9px 16px;
            transition: all 0.2s ease;
        }

        .os-staff-orders .os-orders-pagination .btn:hover {
            background: var(--orders-primary);
            border-color: var(--orders-primary);
            color: #ffffff;
        }

        .os-staff-orders .os-orders-page-indicator {
            padding: 9px 15px;
            border-radius: 10px;
            background: var(--orders-soft);
            color: var(--orders-primary-hover);
            font-weight: 700;
            white-space: nowrap;
        }

        @media (max-width: 575.98px) {
            .os-staff-orders .os-orders-panel {
                padding: 16px 12px;
                border-radius: 14px;
            }

            .os-staff-orders .os-orders-pagination {
                gap: 8px;
            }

            .os-staff-orders .os-orders-pagination .btn {
                padding: 8px 12px;
                font-size: 0.875rem;
            }
        }
    </style>
</head>

<body>

    <div class="os-staff-orders">

        <div
            th:replace="~{fragments/components :: pageHeader('Danh sách đơn hàng', 'Chỉ hiển thị đơn thuộc chi nhánh được phân công.')}">
        </div>

        <section class="os-orders-panel">

            <p class="os-orders-count">
                Tổng số đơn:
                <strong id="order-count" th:text="${orders.totalElements}"></strong>
            </p>

            <div class="os-orders-table">
                <div th:replace="~{staff/orders/fragments :: table(${orders.content})}"></div>
            </div>

            <nav aria-label="Phân trang đơn hàng" class="os-orders-pagination" th:if="${orders.totalPages > 1}">

                <a class="btn btn-outline-secondary" th:if="${orders.hasPrevious()}"
                    th:href="@{/staff/orders(page=${orders.number - 1})}">
                    Trang trước
                </a>

                <span class="os-orders-page-indicator"
                    th:text="'Trang ' + ${orders.number + 1} + ' / ' + ${orders.totalPages}">
                </span>

                <a class="btn btn-outline-secondary" th:if="${orders.hasNext()}"
                    th:href="@{/staff/orders(page=${orders.number + 1})}">
                    Trang sau
                </a>

            </nav>

        </section>

    </div>

</body>

</html>
