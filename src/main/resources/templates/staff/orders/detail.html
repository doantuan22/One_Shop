<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Chi tiết đơn hàng</title>

    <style>
        .os-staff-order-detail {
            --detail-primary: #FF7F50;
            --detail-primary-hover: #e86738;
            --detail-soft: #fff5f2;
            --detail-border: #ffd5c7;
            --detail-text: #2c3038;
        }

        /* Back navigation */
        .os-staff-order-detail .os-detail-back {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 18px;
            border: 1px solid var(--detail-border);
            border-radius: 10px;
            background: #fff;
            color: var(--detail-primary-hover);
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .os-staff-order-detail .os-detail-back:hover {
            background: var(--detail-soft);
            border-color: var(--detail-primary);
            color: var(--detail-primary-hover);
        }

        /* Customer information */
        .os-staff-order-detail .os-detail-customer {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            padding: 16px 20px;
            margin-bottom: 20px;
            border: 1px solid var(--detail-border);
            border-radius: 14px;
            background: var(--detail-soft);
            color: var(--detail-text);
        }

        .os-staff-order-detail .os-detail-customer strong {
            color: #bf360c;
            font-weight: 700;
        }

        /* Detail section */
        .os-staff-order-detail .os-detail-content {
            padding: 22px;
            border: 1px solid #f3e5df;
            border-radius: 16px;
            background: #ffffff;
            box-shadow: 0 6px 22px rgba(255, 127, 80, 0.05);
            overflow-x: auto;
        }

        /* Fulfillment actions */
        .os-staff-order-detail .os-fulfillment-card {
            padding: 24px;
            border: 1px solid var(--detail-border);
            border-radius: 16px;
            background: #ffffff;
            box-shadow: 0 6px 22px rgba(255, 127, 80, 0.06);
        }

        .os-staff-order-detail .os-fulfillment-card form+form {
            margin-top: 18px;
            padding-top: 18px;
            border-top: 1px solid #f3e5df;
        }

        /* Input */
        .os-staff-order-detail .form-control {
            border: 1px solid #f3e5df;
            border-radius: 10px;
            padding: 12px 14px;
            background: #ffffff;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .os-staff-order-detail .form-control:focus {
            border-color: var(--detail-primary);
            box-shadow: 0 0 0 0.2rem rgba(255, 127, 80, 0.15);
        }

        .os-staff-order-detail .form-label {
            color: var(--detail-text);
            font-weight: 600;
            margin-bottom: 8px;
        }

        /* Action buttons */
        .os-staff-order-detail .os-fulfillment-card .btn-primary {
            padding: 11px 22px;
            border-radius: 10px;
            font-weight: 700;
            background: var(--detail-primary);
            border-color: var(--detail-primary);
            color: #ffffff;
            transition: all 0.2s ease;
        }

        .os-staff-order-detail .os-fulfillment-card .btn-primary:hover {
            background: var(--detail-primary-hover);
            border-color: var(--detail-primary-hover);
            box-shadow: 0 5px 16px rgba(255, 127, 80, 0.22);
        }

        /* Warning messages */
        .os-staff-order-detail .alert-warning {
            padding: 14px 16px;
            border: 1px solid #ffe0b2;
            border-radius: 10px;
            background: #fff8e8;
            color: #995200;
        }

        /* Responsive */
        @media (max-width: 575.98px) {
            .os-staff-order-detail .os-detail-content {
                padding: 14px;
                border-radius: 12px;
            }

            .os-staff-order-detail .os-detail-customer {
                padding: 14px;
            }

            .os-staff-order-detail .os-fulfillment-card {
                padding: 16px;
            }

            .os-staff-order-detail .os-fulfillment-card .btn-primary {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="os-staff-order-detail">

        <a class="btn btn-outline-secondary mb-3 os-detail-back" th:href="@{/staff/orders}">
            Danh sách đơn hàng
        </a>

        <p class="os-detail-customer">
            Khách hàng:
            <strong id="order-customer" th:text="${customerName}"></strong>
        </p>

        <div class="os-detail-content">
            <div th:replace="~{orders/fragments :: detail(${detail})}"></div>
        </div>

        <div class="card card-body mt-3 os-fulfillment-card" id="fulfillment-action">

            <form th:if="${deliveryAction != null}" method="post"
                th:action="@{/staff/orders/{id}/delivery/{action}(id=${detail.order.orderId},action=${deliveryAction.path})}">

                <p class="small text-secondary"
                    th:if="${deliveryAction.path == 'complete' and detail.order.paymentMethod.name() == 'COD'}">
                    Chỉ xác nhận sau khi đã giao hàng và thu đủ tiền COD.
                </p>

                <button class="btn btn-primary" type="submit" th:text="${deliveryAction.label}">
                </button>
            </form>

            <form th:if="${pickupAction != null}" method="post"
                th:action="@{/staff/orders/{id}/pickup/{action}(id=${detail.order.orderId},action=${pickupAction.path})}">

                <div th:if="${pickupAction.path == 'complete'}">

                    <label for="pickupCode" class="form-label">
                        Mã nhận hàng khách cung cấp
                    </label>

                    <input id="pickupCode" name="pickupCode" type="text" class="form-control mb-2 font-monospace"
                        minlength="6" maxlength="20" required autocomplete="off" autocapitalize="characters"
                        aria-describedby="pickup-help">

                    <p id="pickup-help" class="small text-secondary">
                        Nhập mã khách cung cấp để xác nhận nhận hàng.
                    </p>

                    <p class="alert alert-warning" th:if="${detail.order.paymentMethod.name() == 'PAY_AT_STORE'}">
                        Chỉ xác nhận sau khi đã thu đủ tổng tiền của đơn tại cửa hàng.
                    </p>

                </div>

                <button class="btn btn-primary" type="submit" th:text="${pickupAction.label}">
                </button>
            </form>

            <p class="text-secondary mb-0" th:if="${deliveryAction == null and pickupAction == null}">
                Không có thao tác xử lý ở trạng thái này.
            </p>

        </div>

    </div>

</body>

</html>
