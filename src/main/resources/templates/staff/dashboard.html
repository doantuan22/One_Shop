<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><title>Tổng quan chi nhánh</title></head>
<body>
<div th:replace="~{fragments/components :: pageHeader('Tổng quan chi nhánh', 'Chỉ hiển thị dữ liệu của chi nhánh bạn được phân công.')}"></div>
<div class="alert alert-warning" id="no-store-scope" role="alert" th:if="${dashboard == null}">
    Tài khoản của bạn chưa được phân công chi nhánh nào nên chưa thể xem đơn hàng hay tồn kho.
    Vui lòng liên hệ quản trị viên.
</div>
<th:block th:if="${dashboard != null}">
    <section class="mb-4" th:each="stats : ${dashboard.stores}" th:attr="data-dashboard-store-id=${stats.store.id}">
        <h2 class="h5" th:text="${stats.store.name}"></h2>
        <p class="mb-1" th:text="${stats.store.code} + ' · ' + ${stats.store.address}"></p>
        <p class="small text-secondary">
            <span th:text="${stats.store.area} + ' · ' + ${stats.store.provinceCity}"></span>
            <span th:if="${stats.store.phone}" th:text="' · ' + ${stats.store.phone}"></span>
            <span th:if="${stats.store.openingHours}" th:text="' · ' + ${stats.store.openingHours}"></span>
        </p>
        <div class="row g-3">
            <div class="col-12 col-sm-6 col-xl-3" data-metric="pending-orders" th:attr="data-value=${stats.pendingOrderCount}">
                <div th:replace="~{fragments/components :: statCard('Đơn cần xử lý', ${stats.pendingOrderCount}, 'Đã xác nhận, đang chuẩn bị, đóng gói hoặc giao hàng')}"></div>
            </div>
            <div class="col-12 col-sm-6 col-xl-3" data-metric="waiting-pickup" th:attr="data-value=${stats.waitingPickupCount}">
                <div th:replace="~{fragments/components :: statCard('Đơn chờ khách nhận tại cửa hàng', ${stats.waitingPickupCount}, 'Nhận tại cửa hàng · Sẵn sàng nhận')}"></div>
            </div>
            <div class="col-12 col-sm-6 col-xl-3" data-metric="low-stock" th:attr="data-value=${stats.lowStockSkuCount}">
                <div th:replace="~{fragments/components :: statCard('Sản phẩm sắp hết hàng', ${stats.lowStockSkuCount}, 'SKU đang kinh doanh · Tồn kho 1–' + ${dashboard.lowStockThreshold})}"></div>
            </div>
            <div class="col-12 col-sm-6 col-xl-3" data-metric="out-of-stock" th:attr="data-value=${stats.outOfStockSkuCount}">
                <div th:replace="~{fragments/components :: statCard('Sản phẩm hết hàng', ${stats.outOfStockSkuCount}, 'SKU đang kinh doanh · Tồn kho bằng 0')}"></div>
            </div>
        </div>
    </section>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h5 mb-0">Đơn hàng gần đây</h2>
        <a class="btn btn-outline-primary btn-sm" th:href="@{/staff/orders}">Xem tất cả đơn hàng</a>
    </div>
    <div th:replace="~{staff/orders/fragments :: table(${dashboard.recentOrders})}"></div>
</th:block>
</body></html>
