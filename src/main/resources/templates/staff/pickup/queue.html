<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Hàng chờ nhận tại cửa hàng</title>
    <style>
        .os-pickup-queue {
            --queue-primary: #FF7F50;
            --queue-hover: #e86738;
            --queue-soft: #fff5f2;
            --queue-border: #ffd5c7;
        }

        .os-pickup-queue .os-queue-panel {
            padding: 24px;
            border: 1px solid var(--queue-border);
            border-radius: 18px;
            background: #ffffff;
            box-shadow: 0 6px 22px rgba(255, 127, 80, 0.06);
        }

        .os-pickup-queue .os-queue-count {
            display: inline-flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            padding: 10px 16px;
            margin-bottom: 20px;
            background: var(--queue-soft);
            border: 1px solid var(--queue-border);
            border-radius: 12px;
            color: #2c3038;
        }

        .os-pickup-queue .os-queue-count strong {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--queue-hover);
        }

        .os-pickup-queue .os-queue-table {
            width: 100%;
            overflow-x: auto;
            border: 1px solid #f3e5df;
            border-radius: 14px;
            background: #fff;
        }

        .os-pickup-queue .os-queue-pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 14px;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #f3e5df;
        }

        .os-pickup-queue .os-queue-pagination .btn {
            padding: 9px 16px;
            border: 1px solid var(--queue-border);
            border-radius: 10px;
            background: #fff;
            color: var(--queue-hover);
            font-weight: 600;
            transition: all .2s ease;
        }

        .os-pickup-queue .os-queue-pagination .btn:hover {
            background: var(--queue-primary);
            border-color: var(--queue-primary);
            color: #fff;
        }

        .os-pickup-queue .os-queue-page-indicator {
            padding: 9px 15px;
            border-radius: 10px;
            background: var(--queue-soft);
            color: var(--queue-hover);
            font-weight: 700;
        }

        @media (max-width: 575.98px) {
            .os-pickup-queue .os-queue-panel {
                padding: 16px 12px;
                border-radius: 14px;
            }

            .os-pickup-queue .os-queue-pagination {
                gap: 8px;
            }
        }
    </style>
</head>

<body>
    <div class="os-pickup-queue">

        <div
            th:replace="~{fragments/components :: pageHeader('Hàng chờ nhận tại cửa hàng', 'Đơn nhận tại cửa hàng đã xác nhận, đang chuẩn bị hoặc chờ khách nhận trong chi nhánh được phân công.')}">
        </div>

        <section class="os-queue-panel">

            <p class="text-secondary os-queue-count">
                Tổng số đơn:
                <strong id="pickup-queue-count" th:text="${orders.totalElements}"></strong>
            </p>

            <div class="os-queue-table">
                <div th:replace="~{staff/orders/fragments :: table(${orders.content})}"></div>
            </div>

            <nav aria-label="Phân trang đơn nhận tại cửa hàng" class="os-queue-pagination"
                th:if="${orders.totalPages > 1}">

                <a class="btn btn-outline-secondary" th:if="${orders.hasPrevious()}"
                    th:href="@{/staff/pickup(page=${orders.number - 1})}">
                    Trang trước
                </a>

                <span class="os-queue-page-indicator"
                    th:text="'Trang ' + ${orders.number + 1} + ' / ' + ${orders.totalPages}">
                </span>

                <a class="btn btn-outline-secondary" th:if="${orders.hasNext()}"
                    th:href="@{/staff/pickup(page=${orders.number + 1})}">
                    Trang sau
                </a>
            </nav>

        </section>
    </div>
</body>

</html>
