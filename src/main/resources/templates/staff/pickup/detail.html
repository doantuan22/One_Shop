<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Đơn nhận tại cửa hàng</title>
    <style>
        .os-pickup-detail {
            --pickup-primary: #FF7F50;
            --pickup-hover: #e86738;
            --pickup-soft: #fff5f2;
            --pickup-border: #ffd5c7;
        }

        .os-pickup-detail .os-back-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 16px;
            border: 1px solid var(--pickup-border);
            border-radius: 10px;
            background: #ffffff;
            color: var(--pickup-hover);
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .os-pickup-detail .os-back-link:hover {
            background: var(--pickup-soft);
            border-color: var(--pickup-primary);
            color: var(--pickup-hover);
        }

        .os-pickup-detail .os-detail-panel {
            padding: 22px;
            background: #ffffff;
            border: 1px solid #f3e5df;
            border-radius: 16px;
            box-shadow: 0 6px 22px rgba(255, 127, 80, 0.05);
            overflow-x: auto;
        }

        .os-pickup-detail .os-action-panel {
            padding: 24px;
            border: 1px solid var(--pickup-border);
            border-radius: 16px;
            background: #ffffff;
            box-shadow: 0 6px 22px rgba(255, 127, 80, 0.06);
        }

        .os-pickup-detail .form-label {
            font-weight: 700;
            color: #2c3038;
            margin-bottom: 8px;
        }

        .os-pickup-detail .form-control {
            padding: 12px 14px;
            border: 1px solid #f3e5df;
            border-radius: 10px;
            transition: border-color .2s, box-shadow .2s;
        }

        .os-pickup-detail .form-control:focus {
            border-color: var(--pickup-primary);
            box-shadow: 0 0 0 .2rem rgba(255, 127, 80, .16);
        }

        .os-pickup-detail .os-action-panel .btn-primary {
            background: var(--pickup-primary);
            border-color: var(--pickup-primary);
            border-radius: 10px;
            padding: 11px 22px;
            font-weight: 700;
            color: #fff;
        }

        .os-pickup-detail .os-action-panel .btn-primary:hover {
            background: var(--pickup-hover);
            border-color: var(--pickup-hover);
            box-shadow: 0 5px 16px rgba(255, 127, 80, .22);
        }

        .os-pickup-detail .alert-warning {
            background: #fff8e8;
            border: 1px solid #ffe0b2;
            border-radius: 10px;
            color: #995200;
            padding: 14px 16px;
        }

        .os-pickup-detail .os-no-action {
            padding: 14px 18px;
            background: var(--pickup-soft);
            border: 1px solid var(--pickup-border);
            border-radius: 12px;
        }

        @media (max-width: 575.98px) {

            .os-pickup-detail .os-detail-panel,
            .os-pickup-detail .os-action-panel {
                padding: 16px;
            }

            .os-pickup-detail .os-action-panel .btn-primary {
                width: 100%;
            }
        }
    </style>
</head>

<body th:with="order=${orderDetail.order}">
    <div class="os-pickup-detail">

        <a class="btn btn-outline-secondary btn-sm mb-3 os-back-link" th:href="@{/staff/orders/pickup}">
            Danh sách đơn nhận tại cửa hàng
        </a>

        <div class="os-detail-panel">
            <div th:replace="~{orders/fragments :: detail(${orderDetail})}"></div>
        </div>

        <form class="card card-body mt-3 os-action-panel" th:if="${order.nextAction != null}" method="post"
            th:action="@{/staff/orders/pickup/{id}/{action}(id=${order.orderId},action=${order.nextAction.path})}">

            <div th:if="${order.nextAction.path == 'complete'}">
                <label for="pickupCode" class="form-label">
                    Mã nhận hàng khách cung cấp
                </label>

                <input id="pickupCode" name="pickupCode" type="text" class="form-control mb-2 font-monospace"
                    minlength="6" maxlength="20" required autocomplete="off" autocapitalize="characters"
                    aria-describedby="pickup-help">

                <p id="pickup-help" class="small text-secondary">
                    Nhập mã hiển thị trong chi tiết đơn hàng của khách để xác nhận nhận hàng.
                </p>

                <p class="alert alert-warning" th:if="${order.paymentMethod.name() == 'PAY_AT_STORE'}">
                    Chỉ bấm xác nhận sau khi đã thu đủ tổng tiền của đơn tại cửa hàng.
                </p>
            </div>

            <button class="btn btn-primary" type="submit" th:text="${order.nextAction.label}"></button>
        </form>

        <p class="text-secondary mt-3 os-no-action" th:if="${order.nextAction == null}">
            Không có thao tác nhận hàng ở trạng thái này.
        </p>

    </div>
</body>

</html>
