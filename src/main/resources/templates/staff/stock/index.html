<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <title th:text="${historySelection} ? 'Lịch sử tồn kho' : 'Tồn kho chi nhánh'"></title>
    <style>
        .os-stock-page {
            --stock-coral: #FF7F50;
            --stock-dark: #e86738;
            --stock-soft: #fff5f2;
            --stock-border: #ffd5c7;
        }

        .os-stock-page .os-stock-count {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            padding: 12px 18px;
            margin-bottom: 20px;
            border: 1px solid var(--stock-border);
            border-radius: 12px;
            background: var(--stock-soft);
        }

        .os-stock-page .os-stock-count strong {
            color: var(--stock-dark);
            font-size: 1.2rem;
            font-weight: 800;
        }

        .os-stock-page .os-stock-table {
            background: #fff;
            border: 1px solid var(--stock-border);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(255, 127, 80, .06);
        }

        .os-stock-page .os-stock-table .table {
            margin-bottom: 0;
            --bs-table-bg: #fff;
        }

        .os-stock-page .os-stock-table thead th {
            background: var(--stock-soft);
            color: #bf360c;
            font-weight: 700;
            padding: 15px 14px;
            white-space: nowrap;
            border-bottom: 1px solid var(--stock-border);
        }

        .os-stock-page .os-stock-table tbody td {
            padding: 14px;
            vertical-align: middle;
            border-color: #f3e5df;
        }

        .os-stock-page .os-stock-table tbody tr:hover td {
            background: #fffaf8;
        }

        .os-stock-page [data-field="exact-quantity"] {
            color: var(--stock-dark);
            font-weight: 800;
        }

        .os-stock-page .btn-outline-primary {
            color: var(--stock-dark);
            border-color: var(--stock-coral);
            border-radius: 9px;
        }

        .os-stock-page .btn-outline-primary:hover {
            background: var(--stock-coral);
            color: #fff;
        }

        .os-stock-page .btn-outline-secondary {
            border-radius: 9px;
        }

        .os-stock-page .os-stock-pagination {
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 22px;
            padding: 16px;
            border-radius: 12px;
            background: #fff;
            border: 1px solid #f3e5df;
        }

        @media (max-width: 767.98px) {
            .os-stock-page .os-stock-table {
                overflow-x: auto;
            }

            .os-stock-page .os-stock-table .table {
                min-width: 760px;
            }
        }
    </style>
</head>

<body>
    <div class="os-stock-page">
        <div
            th:replace="~{fragments/components :: pageHeader(${historySelection} ? 'Lịch sử tồn kho' : 'Tồn kho chi nhánh', ${historySelection} ? 'Chọn sản phẩm để xem biến động tồn của chi nhánh được phân công.' : 'Tồn thực tế của các sản phẩm thuộc chi nhánh được phân công.')}">
        </div>

        <p class="text-secondary os-stock-count">
            Số SKU tại chi nhánh:
            <strong id="stock-count" th:text="${stock.totalElements}"></strong>
        </p>

        <div class="table-responsive os-stock-table">
            <table class="table os-table align-middle">
                <thead>
                    <tr>
                        <th>Chi nhánh</th>
                        <th>SKU / Sản phẩm</th>
                        <th>Giá online chung</th>
                        <th>Trạng thái</th>
                        <th>Tồn thực tế</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${stock.content}"
                        th:attr="data-store-product-id=${item.storeProductId},data-store-id=${item.storeId}">
                        <td th:text="${item.storeName}"></td>
                        <td>
                            <strong th:text="${item.sku}"></strong>
                            <div th:text="${item.productName}"></div>
                        </td>
                        <td>
                            <span th:replace="~{fragments/components :: price(${item.price})}"></span>
                        </td>
                        <td>
                            <span th:text="${item.status.name() == 'ACTIVE'} ? 'Đang kinh doanh' : 'Ngừng kinh doanh'"></span>
                            <span class="badge text-bg-danger ms-1" th:if="${item.quantity == 0}">Hết hàng</span>
                            <span class="badge text-bg-warning ms-1" th:if="${item.quantity > 0 and item.quantity <= lowStockThreshold}">Sắp hết</span>
                        </td>
                        <td class="fw-bold" data-field="exact-quantity" th:text="${item.quantity}"></td>
                        <td>
                            <a class="btn btn-outline-primary btn-sm" th:unless="${historySelection}"
                                th:href="@{/staff/stock/{id}/adjust(id=${item.storeProductId})}">Điều chỉnh tồn</a>
                            <a class="btn btn-outline-secondary btn-sm"
                                th:href="@{/staff/inventory-history/{id}(id=${item.storeProductId})}">Lịch sử</a>
                        </td>
                    </tr>
                    <tr th:if="${stock.isEmpty()}">
                        <td colspan="6" class="text-center text-secondary">Chưa có sản phẩm tại chi nhánh.</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <nav aria-label="Phân trang tồn kho" class="d-flex align-items-center gap-3 os-stock-pagination"
            th:if="${stock.totalPages > 1}">
            <a class="btn btn-outline-secondary" th:if="${stock.hasPrevious()}"
                th:href="@{${listPath}(page=${stock.number - 1})}">Trang trước</a>
            <span th:text="'Trang ' + ${stock.number + 1} + ' / ' + ${stock.totalPages}"></span>
            <a class="btn btn-outline-secondary" th:if="${stock.hasNext()}"
                th:href="@{${listPath}(page=${stock.number + 1})}">Trang sau</a>
        </nav>
    </div>
</body>

</html>
