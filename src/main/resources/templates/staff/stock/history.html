<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Lịch sử biến động tồn kho</title>
    <style>
        .os-stock-history {
            --history-coral: #FF7F50;
            --history-dark: #e86738;
            --history-soft: #fff5f2;
            --history-border: #ffd5c7;
        }

        .os-stock-history .os-history-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .os-stock-history .os-history-actions .btn {
            border-radius: 10px;
            padding: 9px 16px;
            font-weight: 600;
        }

        .os-stock-history .btn-outline-primary {
            color: var(--history-dark);
            border-color: var(--history-coral);
        }

        .os-stock-history .btn-outline-primary:hover {
            background: var(--history-coral);
            color: #fff;
        }

        .os-stock-history .os-history-product {
            padding: 22px;
            margin-bottom: 22px;
            border: 1px solid var(--history-border);
            border-radius: 16px;
            background: linear-gradient(135deg, var(--history-soft), #fff);
        }

        .os-stock-history .os-history-product h2 {
            color: #bf360c;
            font-weight: 800;
        }

        .os-stock-history .os-history-metrics {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin-top: 15px;
        }

        .os-stock-history .os-history-metrics p {
            margin: 0;
            background: white;
            border: 1px solid var(--history-border);
            padding: 10px 16px;
            border-radius: 10px;
        }

        .os-stock-history .os-history-metrics strong {
            color: var(--history-dark);
            font-weight: 800;
        }

        .os-stock-history .os-history-table {
            border: 1px solid var(--history-border);
            border-radius: 16px;
            overflow: hidden;
            background: #fff;
        }

        .os-stock-history .os-history-table .table {
            margin-bottom: 0;
        }

        .os-stock-history .os-history-table thead th {
            background: var(--history-soft);
            color: #bf360c;
            font-weight: 700;
            padding: 15px 14px;
            white-space: nowrap;
            border-bottom: 1px solid var(--history-border);
        }

        .os-stock-history .os-history-table tbody td {
            padding: 14px;
            border-color: #f3e5df;
            vertical-align: middle;
        }

        .os-stock-history .os-history-table tbody tr:hover td {
            background: #fffaf8;
        }

        .os-stock-history .os-history-pagination {
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 22px;
            padding: 16px;
            border: 1px solid #f3e5df;
            border-radius: 12px;
            background: #fff;
        }

        @media (max-width: 767.98px) {
            .os-stock-history .os-history-table {
                overflow-x: auto;
            }

            .os-stock-history .os-history-table .table {
                min-width: 820px;
            }
        }
    </style>
</head>

<body>
    <div class="os-stock-history">

        <div
            th:replace="~{fragments/components :: pageHeader('Lịch sử biến động tồn kho', 'Biến động của sản phẩm thuộc chi nhánh được phân công.')}">
        </div>

        <div class="alert alert-success" role="alert"
            th:if="${param.success != null and param.success[0] == 'adjusted'}">
            Đã cập nhật tồn kho và ghi biến động.
        </div>

        <div class="alert alert-info" role="alert" th:if="${param.success != null and param.success[0] == 'unchanged'}">
            Số lượng không thay đổi; không có biến động mới.
        </div>

        <div class="os-history-actions">
            <a class="btn btn-outline-secondary" th:href="@{/staff/inventory-history}">Chọn sản phẩm khác</a>
            <a class="btn btn-outline-primary" th:href="@{/staff/stock/{id}/adjust(id=${stock.storeProductId})}">Điều
                chỉnh tồn</a>
        </div>

        <section class="os-history-product">
            <h2 class="h5" th:text="${stock.productName}"></h2>
            <p>
                <span th:text="${stock.sku}"></span> ·
                <span th:text="${stock.storeName}"></span>
            </p>
            <div class="os-history-metrics">
                <p>Tồn hiện tại: <strong id="current-quantity" th:text="${stock.quantity}"></strong></p>
                <p>Số biến động: <strong id="movement-count" th:text="${movements.totalElements}"></strong></p>
            </div>
        </section>

        <div class="table-responsive os-history-table">
            <table class="table os-table align-middle">
                <thead>
                    <tr>
                        <th>Loại</th>
                        <th>Trước</th>
                        <th>Sau</th>
                        <th>Thay đổi</th>
                        <th>Người ghi nhận</th>
                        <th>Ghi chú</th>
                        <th>Thời gian</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="movement : ${movements.content}"
                        th:attr="data-movement-id=${movement.id},data-type=${movement.type}">
                        <td th:text="${movement.type}"></td>
                        <td th:text="${movement.quantityBefore}"></td>
                        <td th:text="${movement.quantityAfter}"></td>
                        <td
                            th:text="${movement.quantityChange > 0} ? '+' + ${movement.quantityChange} : ${movement.quantityChange}">
                        </td>
                        <td th:text="${movement.staffName}"></td>
                        <td th:text="${movement.note}"></td>
                        <td th:text="${#temporals.format(movement.createdAt, 'dd/MM/yyyy HH:mm:ss')}"></td>
                    </tr>
                    <tr th:if="${movements.isEmpty()}">
                        <td colspan="7" class="text-center text-secondary">Chưa có biến động tồn kho.</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <nav aria-label="Phân trang biến động tồn" class="d-flex align-items-center gap-3 os-history-pagination"
            th:if="${movements.totalPages > 1}">
            <a class="btn btn-outline-secondary" th:if="${movements.hasPrevious()}"
                th:href="@{/staff/inventory-history/{id}(id=${stock.storeProductId},page=${movements.number - 1})}">Trang
                trước</a>
            <span th:text="'Trang ' + ${movements.number + 1} + ' / ' + ${movements.totalPages}"></span>
            <a class="btn btn-outline-secondary" th:if="${movements.hasNext()}"
                th:href="@{/staff/inventory-history/{id}(id=${stock.storeProductId},page=${movements.number + 1})}">Trang
                sau</a>
        </nav>
    </div>
</body>

</html>
