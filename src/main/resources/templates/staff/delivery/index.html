<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Đơn giao hàng của chi nhánh</title>
    <style>
        .os-delivery-list {
            --coral: #FF7F50;
            --coral-dark: #e86738;
            --coral-deep: #bf360c;
            --coral-soft: #fff5f2;
            --coral-border: #ffd5c7;
        }

        .os-delivery-list .os-delivery-table {
            border: 1px solid var(--coral-border);
            border-radius: 16px;
            background: #fff;
            overflow-x: auto;
            box-shadow: 0 6px 22px rgba(255, 127, 80, .06);
        }

        .os-delivery-list .os-delivery-table .table {
            margin-bottom: 0;
            --bs-table-bg: transparent;
        }

        .os-delivery-list .os-delivery-table thead th {
            padding: 15px 16px;
            background: var(--coral-soft);
            color: var(--coral-deep);
            font-size: .875rem;
            font-weight: 700;
            white-space: nowrap;
            border-bottom: 1px solid var(--coral-border);
        }

        .os-delivery-list .os-delivery-table tbody td {
            padding: 16px;
            vertical-align: middle;
            border-color: #f3e5df;
        }

        .os-delivery-list .os-delivery-table tbody tr:hover td {
            background: #fffaf8;
        }

        .os-delivery-list .os-delivery-table td a:not(.btn) {
            color: var(--coral-dark);
            font-weight: 700;
            text-decoration: none;
        }

        .os-delivery-list .os-delivery-table td a:not(.btn):hover {
            color: var(--coral-deep);
            text-decoration: underline;
        }

        .os-delivery-list .os-delivery-table td:nth-child(5) {
            font-weight: 700;
            white-space: nowrap;
        }

        .os-delivery-list .os-delivery-table .btn-primary {
            background: var(--coral);
            border-color: var(--coral);
            border-radius: 9px;
        }

        .os-delivery-list .os-delivery-table .btn-primary:hover {
            background: var(--coral-dark);
            border-color: var(--coral-dark);
        }

        .os-delivery-list .os-delivery-table .btn-outline-primary {
            color: var(--coral-dark);
            border-color: var(--coral);
            border-radius: 9px;
        }

        .os-delivery-list .os-delivery-table .btn-outline-primary:hover {
            background: var(--coral);
            border-color: var(--coral);
            color: #fff;
        }

        .os-delivery-list .os-delivery-empty {
            padding: 36px 20px !important;
            background: #fffaf8;
        }

        @media (max-width: 991.98px) {
            .os-delivery-list .os-delivery-table .table {
                min-width: 940px;
            }
        }
    </style>
</head>

<body>
    <div class="os-delivery-list">

        <div
            th:replace="~{fragments/components :: pageHeader('Đơn giao hàng', 'Đơn giao tận nơi của các chi nhánh bạn được phân công.')} ">
        </div>

        <div class="table-responsive os-delivery-table">
            <table class="table align-middle">
                <thead>
                    <tr>
                        <th>Đơn hàng / Chi nhánh</th>
                        <th>Ngày tạo / Người nhận</th>
                        <th>Thanh toán</th>
                        <th>Trạng thái</th>
                        <th>Tổng tiền</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:if="${deliveryOrders.isEmpty()}">
                        <td colspan="6" class="text-secondary text-center py-4 os-delivery-empty">
                            Chưa có đơn giao hàng.
                        </td>
                    </tr>

                    <tr th:each="order : ${deliveryOrders}" th:attr="data-order-id=${order.orderId}">
                        <td>
                            <a th:href="@{/staff/orders/delivery/{id}(id=${order.orderId})}"
                                th:text="'#' + ${order.orderId}"></a>
                            <div class="small text-secondary" th:text="${order.storeName}"></div>
                        </td>

                        <td>
                            <div th:text="${#temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm')}"></div>
                            <div th:text="${order.receiverName}"></div>
                        </td>

                        <td>
                            <div th:replace="~{staff/delivery/fragments :: method(${order.paymentMethod})}"></div>
                            <div th:replace="~{staff/delivery/fragments :: payment(${order.paymentStatus})}"></div>
                        </td>

                        <td>
                            <span th:replace="~{staff/delivery/fragments :: state(${order.orderStatus})}"></span>
                        </td>

                        <td>
                            <span th:replace="~{fragments/components :: price(${order.totalAmount})}"></span>
                        </td>

                        <td>
                            <div th:replace="~{staff/delivery/fragments :: action(${order})}"></div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>
</body>

</html>
