<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Sản phẩm đã chọn</title>
</head>
<body>
<!--/*
    The lines chosen in the cart, grouped by Store: exactly what checkout will receive (a list of cartItemIds, one
    future Order per Store). Read-only: nothing is ordered, reserved or paid here.
*/-->
<nav aria-label="breadcrumb">
    <ol class="breadcrumb small">
        <li class="breadcrumb-item"><a th:href="@{/cart}">Giỏ hàng</a></li>
        <li class="breadcrumb-item active" aria-current="page">Sản phẩm đã chọn</li>
    </ol>
</nav>

<h1 class="h3 mb-3">Sản phẩm đã chọn</h1>
<p class="text-secondary" id="selection-summary">
    Bạn đã chọn <strong th:text="${selection.itemCount}">3</strong> sản phẩm từ
    <strong th:text="${selection.groups.size()}">2</strong> chi nhánh. Mỗi chi nhánh sẽ là một đơn hàng riêng.
</p>

<section class="card shadow-sm mb-3 os-selection-group" th:each="group : ${selection.groups}"
         th:attr="data-store-id=${group.storeId}">
    <div class="card-header bg-white">
        <h2 class="h6 mb-0" th:text="${group.storeName}">OneShop Thủ Đức</h2>
        <div class="small text-secondary" th:text="${group.storeAddress}">101 Võ Văn Ngân</div>
    </div>
    <ul class="list-group list-group-flush">
        <li class="list-group-item d-flex flex-wrap justify-content-between gap-2" th:each="item : ${group.items}"
            th:attr="data-cart-item-id=${item.cartItemId}">
            <div>
                <div class="fw-semibold" th:text="${item.productName}">Tên sản phẩm</div>
                <div class="small text-secondary">
                    <span th:replace="~{fragments/components :: price(${item.unitPrice})}"></span>
                    &times; <span th:text="${item.quantity}">2</span>
                </div>
            </div>
            <strong><span th:replace="~{fragments/components :: price(${item.subtotal})}"></span></strong>
        </li>
    </ul>
    <div class="card-footer bg-white d-flex justify-content-between">
        <span class="text-secondary">Tạm tính tại chi nhánh</span>
        <strong><span th:replace="~{fragments/components :: price(${group.subtotal})}"></span></strong>
    </div>
</section>

<div class="card shadow-sm">
    <div class="card-body d-flex flex-wrap justify-content-between align-items-center gap-3">
        <div>
            <div class="text-secondary">Tổng tạm tính</div>
            <div class="fs-4 fw-semibold" id="selection-total"><span th:replace="~{fragments/components :: price(${selection.total})}"></span></div>
        </div>
        <div class="text-end">
            <a class="btn btn-outline-secondary" th:href="@{/cart}">Quay lại giỏ hàng</a>
            <p class="small text-secondary mt-2 mb-0">Bước đặt hàng và thanh toán chưa được mở.</p>
        </div>
    </div>
</div>
</body>
</html>
