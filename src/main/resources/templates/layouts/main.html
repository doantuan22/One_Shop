<!DOCTYPE html>
<!--/*
    SiteMesh decorator. Every HTML page is rendered on its own first; SiteMesh then extracts its
    <title>, <head> and <body> and DecoratorController exposes them here as pageTitle/pageHead/pageBody.
*/-->
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${#strings.isEmpty(pageTitle)} ? 'OneShop' : ${pageTitle} + ' | OneShop'">OneShop</title>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <th:block th:utext="${pageHead}"></th:block>
</head>
<body class="d-flex flex-column min-vh-100" data-layout="sitemesh">
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="flex-grow-1 py-4" id="main-content">
    <div class="container" th:utext="${pageBody}"></div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script th:src="@{/vendor/bootstrap/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
