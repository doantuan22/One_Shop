<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">

<body>
    <!--/*
    Staff layout parts. The Store scope reads the model attribute `assignedStores` (List<StoreResponse> of the
    logged-in Staff's ACTIVE assignments, Roadmap V2 BR-14), set on every Staff request by StaffStoreScopeInterceptor.
    This is display only: the scope itself is enforced by that interceptor and by StoreService.requireAssignedStore.
    The header is the same operation-console appbar as the Admin area (css/admin-staff.css); only the scope badge
    and the sidebar items differ.
*/-->
    <header th:fragment="topbar" class="navbar navbar-dark os-appbar sticky-top px-3 px-md-4 py-2 border-bottom shadow-sm" th:with="stores=${assignedStores}">
        <div class="d-flex align-items-center gap-3">
            <button class="navbar-toggler d-lg-none border-0 p-1 me-1 shadow-none" type="button" data-bs-toggle="offcanvas"
                data-bs-target="#appSidebar" aria-controls="appSidebar" aria-label="Mở menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <a class="os-brand-title" th:href="@{/staff}">
                <span class="os-brand-logo-wrap">
                    <img th:src="@{/images/One.png}" src="/images/One.png" alt="OneShop" class="os-appbar-logo">
                </span>
                <span class="os-brand-badge">Staff</span>
            </a>
            <div class="d-none d-md-flex align-items-center ms-2">
                <span class="os-scope-pill badge os-scope-badge" id="staff-scope-badge">
                    <span class="os-scope-dot"></span>
                    <span th:text="${stores == null or stores.isEmpty()} ? 'Chưa được phân công' : (${stores.size() == 1} ? ${stores[0].name} : ${stores.size()} + ' chi nhánh')">Chi nhánh</span>
                </span>
            </div>
        </div>

        <div class="d-flex align-items-center gap-3 ms-auto">
            <a class="btn-topbar-store d-none d-md-inline-flex" th:href="@{/}">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    <polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
                <span>Trang bán hàng</span>
            </a>

            <div class="dropdown">
                <button class="btn btn-topbar-user dropdown-toggle" type="button" id="staffUserDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                    <span class="user-avatar-circle">
                        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                    </span>
                    <span sec:authentication="name">staff</span>
                </button>

                <ul class="dropdown-menu dropdown-menu-end admin-dropdown-menu" aria-labelledby="staffUserDropdown">
                    <li class="admin-dropdown-header">
                        <div class="text-secondary small" style="font-size: 0.72rem;">Tài khoản nhân viên</div>
                        <div class="fw-bold text-dark text-truncate" sec:authentication="name">staff</div>
                    </li>
                    <li>
                        <form th:action="@{/logout}" method="post" class="m-0">
                            <button type="submit" class="dropdown-item d-flex align-items-center gap-2 text-danger">
                                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                                    <polyline points="16 17 21 12 16 7"/>
                                    <line x1="21" y1="12" x2="9" y2="12"/>
                                </svg>
                                <span>Đăng xuất</span>
                            </button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </header>

    <div th:fragment="sidebar" class="os-sidebar offcanvas-lg offcanvas-start col-lg-3 col-xl-2 p-0" tabindex="-1"
        id="appSidebar" aria-labelledby="appSidebarLabel" th:with="stores=${assignedStores}">
        <div class="offcanvas-header border-bottom d-lg-none">
            <h2 class="offcanvas-title h6 mb-0" id="appSidebarLabel">Menu nhân viên</h2>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#appSidebar"
                aria-label="Đóng"></button>
        </div>
        <div class="offcanvas-body d-block p-3">
            <section class="os-store-scope os-store-scope-card mb-3" id="staff-store-scope" aria-label="Chi nhánh được phân công">
                <div class="os-store-scope__label os-store-scope-card__label">Chi nhánh được phân công</div>
                <div th:if="${stores != null and !stores.isEmpty()}">
                    <div class="mb-1" th:each="store : ${stores}">
                        <strong th:text="${store.name}">OneShop Thủ Đức</strong>
                        <div class="small os-muted-text" th:text="${store.code} + ' · ' + ${store.area}">TD · Thủ Đức
                        </div>
                    </div>
                </div>
                <div class="small text-warning-emphasis" th:unless="${stores != null and !stores.isEmpty()}">
                    Tài khoản chưa được phân công chi nhánh nào.
                </div>
            </section>

            <nav aria-label="Điều hướng nhân viên">
                <ul class="nav nav-pills flex-column gap-1">
                    <li
                        th:replace="~{fragments/components :: navItem('/staff', 'Tổng quan', ${currentPath == '/staff/dashboard' or currentPath == '/staff/'} ? '/staff' : ${currentPath}, true)}">
                    </li>
                    <li
                        th:replace="~{fragments/components :: navItem('/staff/fulfillments', 'Đơn hàng cần xử lý', ${currentPath != null and (#strings.startsWith(currentPath, '/staff/fulfillments/delivery') or #strings.startsWith(currentPath, '/staff/fulfillments/pickup'))} ? null : ${currentPath}, true)}">
                    </li>
                    <li
                        th:replace="~{fragments/components :: navItem('/staff/fulfillments/delivery', 'Giao tận nơi', ${currentPath}, true)}">
                    </li>
                    <li
                        th:replace="~{fragments/components :: navItem('/staff/fulfillments/pickup', 'Nhận tại cửa hàng', ${currentPath}, true)}">
                    </li>
                    <li
                        th:replace="~{fragments/components :: navItem('/staff/stock', 'Tồn kho chi nhánh', ${currentPath}, true)}">
                    </li>
                    <li
                        th:replace="~{fragments/components :: navItem('/staff/returns', 'Hàng khách trả', ${currentPath}, true)}">
                    </li>
                    <li
                        th:replace="~{fragments/components :: navItem('/staff/reviews', 'Đánh giá', ${currentPath}, true)}">
                    </li>
                    <li
                        th:replace="~{fragments/components :: navItem('/staff/inventory-history', 'Nhật ký biến động tồn', ${currentPath}, true)}">
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</body>

</html>
