<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<head>
    <meta charset="UTF-8">
</head>
<body>

<header th:fragment="topbar" class="navbar navbar-dark os-appbar sticky-top px-3 px-md-4 py-2 border-bottom shadow-sm">
    <style>
        .os-appbar {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border-color: rgba(255, 255, 255, 0.08) !important;
            min-height: 60px;
            z-index: 1020;
        }

        .os-brand-title {
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #ffffff;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 16px;
        }

        .os-brand-logo-wrap {
            width: 44px;
            height: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .os-appbar-logo {
            height: 60px;
            width: auto;
            object-fit: contain;
            display: block;
            transform: scale(1.7);
            transform-origin: center center;
            margin-top: 7px;
        }

        .os-brand-badge {
            font-size: 0.76rem;
            font-weight: 800;
            padding: 0.28rem 0.65rem;
            border-radius: 7px;
            background: rgba(255, 127, 80, 0.2);
            color: #ff9470;
            border: 1px solid rgba(255, 127, 80, 0.4);
            text-transform: uppercase;
            white-space: nowrap;
        }

        .os-scope-pill {
            background-color: rgba(255, 255, 255, 0.16);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #ffffff;
            font-size: 0.78rem;
            font-weight: 650;
            padding: 0.35rem 0.85rem;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .os-scope-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: #22c55e;
            box-shadow: 0 0 6px rgba(34, 197, 94, 0.8);
        }

        .btn-topbar-store {
            font-size: 0.82rem;
            font-weight: 650;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 9px;
            padding: 0.4rem 0.95rem;
            transition: all 0.15s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .btn-topbar-store:hover {
            color: #f06437;
            background: #ffffff;
            border-color: #ffffff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
        }

        .btn-topbar-user {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 9px;
            padding: 0.34rem 0.85rem;
            color: #ffffff !important;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            font-weight: 650;
            transition: all 0.15s ease;
            white-space: nowrap;
        }

        .btn-topbar-user:hover,
        .btn-topbar-user:focus {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.45);
            box-shadow: none;
        }

        .user-avatar-circle {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background-color: #ffffff;
            color: #f06437;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 800;
        }

        .admin-dropdown-menu {
            border-radius: 14px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.12), 0 8px 10px -6px rgba(0, 0, 0, 0.08);
            min-width: 200px;
            padding: 0.4rem;
            margin-top: 0.5rem !important;
        }

        .admin-dropdown-header {
            padding: 0.6rem 0.8rem;
            border-bottom: 1px solid #f1f5f9;
            margin-bottom: 0.3rem;
        }

        .admin-dropdown-menu .dropdown-item {
            font-size: 0.84rem;
            font-weight: 600;
            color: #334155;
            padding: 0.55rem 0.8rem;
            border-radius: 8px;
            transition: all 0.12s ease;
        }

        .admin-dropdown-menu .dropdown-item:hover {
            background-color: #fef2f2;
            color: #dc2626 !important;
        }
    </style>

    <div class="d-flex align-items-center gap-3">
        <button class="navbar-toggler d-lg-none border-0 p-1 me-1 shadow-none" type="button"
                data-bs-toggle="offcanvas" data-bs-target="#appSidebar"
                aria-controls="appSidebar" aria-label="Mở menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <a class="os-brand-title" th:href="@{/admin}">
            <div class="os-brand-logo-wrap">
                <img th:src="@{/images/One.png}" alt="OneShop" class="os-appbar-logo">
            </div>
            <span class="os-brand-badge">Admin</span>
        </a>

        <div class="d-none d-md-flex align-items-center ms-2">
            <div class="os-scope-pill" id="admin-scope-badge">
                <span class="os-scope-dot"></span>
                <span>Toàn chuỗi</span>
            </div>
        </div>
    </div>

    <div class="d-flex align-items-center gap-3 ms-auto">
        <a class="btn-topbar-store d-none d-md-inline-flex" th:href="@{/}">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            <span>Trang bán hàng</span>
        </a>

        <div class="dropdown">
            <button class="btn btn-topbar-user dropdown-toggle" type="button" id="adminUserDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                <span class="user-avatar-circle">
                    <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                </span>
                <span sec:authentication="name">admin</span>
            </button>

            <ul class="dropdown-menu dropdown-menu-end admin-dropdown-menu" aria-labelledby="adminUserDropdown">
                <li class="admin-dropdown-header">
                    <div class="text-secondary small" style="font-size: 0.72rem;">Tài khoản quản trị</div>
                    <div class="fw-bold text-dark text-truncate" sec:authentication="name">admin</div>
                </li>
                <li>
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="dropdown-item d-flex align-items-center gap-2 text-danger">
                            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                                <polyline points="16 17 21 12 16 7"/>
                                <line x1="21" y1="12" x2="9" y2="12"/>
                            </svg>
                            <span>Đăng xuất</span>
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</header>

<div th:fragment="sidebar" class="os-sidebar offcanvas-lg offcanvas-start col-lg-3 col-xl-2 p-0" tabindex="-1"
     id="appSidebar" aria-labelledby="appSidebarLabel">
    <style>
        .os-sidebar {
            background-color: #ffffff;
            border-right: none;
            box-shadow: 2px 0 16px rgba(15, 23, 42, 0.06);
            min-height: calc(100vh - 60px);
        }

        @media (min-width: 992px) {
            .os-sidebar {
                position: sticky !important;
                top: 60px;
                height: calc(100vh - 60px);
                overflow-y: auto;
                z-index: 1010;
            }

            .os-sidebar::-webkit-scrollbar {
                width: 5px;
            }

            .os-sidebar::-webkit-scrollbar-thumb {
                background: #e2e8f0;
                border-radius: 4px;
            }

            .os-sidebar::-webkit-scrollbar-thumb:hover {
                background: #cbd5e1;
            }
        }

        .os-store-scope-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 0.85rem 1rem;
            margin-bottom: 1.25rem;
        }

        .os-store-scope-card__label {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #64748b;
            margin-bottom: 0.2rem;
        }

        .os-store-scope-card__value {
            font-size: 0.885rem;
            font-weight: 800;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .os-sidebar .nav-pills {
            gap: 4px;
        }

        .os-sidebar .nav-link {
            font-size: 0.875rem;
            font-weight: 600;
            color: #475569 !important;
            padding: 0.65rem 0.95rem;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.15s ease;
            text-decoration: none;
            background-color: transparent;
        }

        .os-sidebar .nav-link:hover {
            color: #0f172a !important;
            background-color: #f1f5f9;
            transform: translateX(2px);
        }

        .os-sidebar .nav-link.active {
            background: linear-gradient(135deg, #ff7f50, #f06437) !important;
            color: #ffffff !important;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(255, 127, 80, 0.25);
            transform: none;
        }
    </style>

    <div class="offcanvas-header border-bottom d-lg-none px-3 py-3">
        <h2 class="offcanvas-title h6 mb-0 fw-bold text-dark" id="appSidebarLabel">Menu quản trị</h2>
        <button type="button" class="btn-close shadow-none" data-bs-dismiss="offcanvas" data-bs-target="#appSidebar"
                aria-label="Đóng"></button>
    </div>

    <div class="offcanvas-body d-block p-3">
        <section class="os-store-scope-card" id="admin-scope" aria-label="Phạm vi quản trị">
            <div class="os-store-scope-card__label">Phạm vi quản trị</div>
            <div class="os-store-scope-card__value">
                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#ff7f50" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="2" y1="12" x2="22" y2="12"/>
                    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                </svg>
                <span>Toàn chuỗi cửa hàng</span>
            </div>
        </section>

        <nav aria-label="Điều hướng quản trị">
            <ul class="nav nav-pills flex-column">
                <li th:replace="~{fragments/components :: navItem('/admin', 'Tổng quan', ${currentPath}, true)}"></li>
                <li th:replace="~{fragments/components :: navItem('/admin/stores', 'Chi nhánh', ${currentPath}, true)}"></li>
                <li th:replace="~{fragments/components :: navItem('/admin/categories', 'Danh mục', ${currentPath}, true)}"></li>
                <li th:replace="~{fragments/components :: navItem('/admin/brands', 'Thương hiệu', ${currentPath}, true)}"></li>
                <li th:replace="~{fragments/components :: navItem('/admin/products', 'Sản phẩm / SKU', ${currentPath}, true)}"></li>
                <li th:replace="~{fragments/components :: navItem('/admin/store-products', 'Sản phẩm theo chi nhánh', ${currentPath}, true)}"></li>
                <li th:replace="~{fragments/components :: navItem('/admin/staff-assignments', 'Phân công nhân viên', ${currentPath}, true)}"></li>
                <li th:replace="~{fragments/components :: navItem('/admin/inventory', 'Tồn kho toàn chuỗi', ${currentPath}, true)}"></li>
                <li th:replace="~{fragments/components :: navItem('/admin/orders', 'Đơn hàng', ${currentPath}, true)}"></li>
                <li th:replace="~{fragments/components :: navItem('/admin/reviews', 'Đánh giá', ${currentPath}, true)}"></li>
                <li th:replace="~{fragments/components :: navItem('/admin/users', 'Người dùng', ${currentPath}, true)}"></li>
            </ul>
        </nav>
    </div>
</div>

</body>
</html>
