<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<!--/*
    Client header. "Chi nhánh đang chọn" reads the request attribute `selectedStore` (a StoreResponse) that
    SelectedStoreInterceptor sets after checking the Store in the database; absent means the whole chain.
*/-->
<header th:fragment="header" class="os-topbar text-white small py-2">
    <div class="container d-flex flex-wrap justify-content-between align-items-center gap-2">
        <div class="os-store-context d-flex flex-wrap align-items-center gap-2" id="store-context"
             th:attr="data-store-scope=${selectedStore != null} ? 'store' : 'chain'">
            <span>
                <span class="opacity-75">Chi nhánh đang chọn:</span>
                <strong th:if="${selectedStore != null}" th:text="${selectedStore.name}">OneShop Thủ Đức</strong>
                <strong th:unless="${selectedStore != null}">Toàn chuỗi</strong>
            </span>
            <a class="link-light" th:href="@{/stores}"
               th:text="${selectedStore != null} ? 'Đổi chi nhánh' : 'Chọn chi nhánh'">Chọn chi nhánh</a>
            <form th:if="${selectedStore != null}" th:action="@{/stores/clear}" method="post" class="d-inline">
                <button type="submit" class="btn btn-link btn-sm link-light p-0 align-baseline">Xem toàn chuỗi</button>
            </form>
        </div>
        <span class="d-none d-md-inline">Hotline: 1900 0000 &middot; Miễn phí vận chuyển cho đơn từ 500.000&nbsp;₫</span>
    </div>
</header>
</body>
</html>
