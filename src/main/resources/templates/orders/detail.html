<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><title>Chi tiết đơn hàng</title></head><body>
<a class="btn btn-outline-secondary btn-sm mb-3" th:href="@{/orders}">Đơn hàng của tôi</a>
<div class="alert alert-success" th:if="${param.cancelled != null and orderDetail.order.orderStatus.name() == 'CANCELLED'}">Đơn đã hủy. Tồn kho đã được hoàn về chi nhánh của đơn.</div>
<div th:replace="~{orders/fragments :: detail(${orderDetail})}"></div>
<form th:if="${canCancel == true}" th:action="@{/orders/{id}/cancel(id=${orderDetail.order.orderId})}" method="post" class="mt-3">
    <p class="small text-secondary">Có thể hủy đơn chưa thanh toán trước khi cửa hàng bắt đầu chuẩn bị hàng.</p>
    <button class="btn btn-outline-danger" type="submit">Hủy đơn hàng</button>
</form>
<a class="btn btn-outline-primary mt-3" th:if="${orderDetail.order.paymentMethod.name() == 'ONLINE'}"
   th:href="@{/orders/{id}/payments(id=${orderDetail.order.orderId})}">Xem thanh toán trực tuyến</a>
</body></html>
