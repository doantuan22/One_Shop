<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu - OneShop</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/bootstrap-coral.css}">
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <style>
        .auth-wrapper {
            min-height: calc(100vh - 120px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2.5rem 1rem;
        }

        .auth-card {
            background: #ffffff;
            border: 1px solid rgba(255, 127, 80, 0.2);
            border-radius: 24px;
            box-shadow: 0 16px 40px rgba(255, 127, 80, 0.08);
            position: relative;
            overflow: hidden;
            width: 100%;
            max-width: 480px;
        }

        .auth-card::before {
            content: "";
            position: absolute;
            top: -70px;
            right: -70px;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 127, 80, 0.15), transparent 70%);
            pointer-events: none;
        }

        .auth-card::after {
            content: "";
            position: absolute;
            bottom: -60px;
            left: -60px;
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 171, 145, 0.18), transparent 70%);
            pointer-events: none;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-header h1 {
            font-size: 1.85rem;
            font-weight: 800;
            color: var(--os-text, #292d32);
            letter-spacing: -0.03em;
            margin-bottom: 0.5rem;
        }

        .auth-header h1 span {
            color: var(--os-coral-dark, #e86738);
        }

        .auth-header p {
            color: var(--os-muted, #707780);
            font-size: 0.95rem;
            margin-bottom: 0;
        }

        .input-group-custom {
            position: relative;
        }

        .input-icon-lead {
            position: absolute;
            top: 24px;
            left: 1rem;
            transform: translateY(-50%);
            color: #a0a6b1;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 4;
            pointer-events: none;
            transition: color 0.3s ease;
        }

        /* ui-system.css loads later and sets .form-control { min-height: 40px }, which made the field 40px tall while the
           icon is centred for 48px (4px too low): a higher specificity and a fixed height keep one shared centre */
        .input-group-custom .form-control-icon {
            padding-left: 2.75rem !important;
            height: 48px;
            min-height: 48px;
            border-radius: 14px;
            border: 1px solid #f0e6e3;
            background-color: #fffaf9;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .form-control-icon:focus {
            background-color: #ffffff;
            border-color: var(--bs-primary, #ff7f50) !important;
            box-shadow: 0 0 0 0.25rem rgba(255, 127, 80, 0.18) !important;
        }

        .form-control-icon:focus + .input-icon-lead,
        .input-group-custom:focus-within .input-icon-lead {
            color: var(--bs-primary, #ff7f50);
        }

        .form-label {
            font-size: 0.875rem;
            font-weight: 600;
            color: #495057;
            margin-bottom: 0.4rem;
        }

        .btn-auth-submit {
            min-height: 48px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 1rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, #ff7f50, #e86738);
            border: none;
            box-shadow: 0 6px 18px rgba(255, 127, 80, 0.25);
            transition: background 0.2s ease, box-shadow 0.2s ease;
            transform: none !important;
        }

        .btn-auth-submit:hover {
            transform: none !important;
            box-shadow: 0 8px 22px rgba(255, 127, 80, 0.35);
            background: linear-gradient(135deg, #e86738, #d65426);
            color: #ffffff;
        }

        .auth-alert {
            border-radius: 12px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0.85rem 1rem;
            border-width: 1px;
        }

        .auth-footer-link {
            color: #ff7f50;
            font-weight: 700;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .auth-footer-link:hover {
            color: #e86738;
            text-decoration: underline;
        }

        @keyframes slideDownFeedback {
            0% {
                opacity: 0;
                transform: translateY(-8px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        :focus-visible {
            outline: 3px solid #1f2937;
            outline-offset: 2px;
            box-shadow: 0 0 0 5px #ffffff;
        }

        .invalid-feedback {
            display: none;
            font-size: 0.825rem;
            color: #dc3545;
            margin-top: 0.35rem;
        }

        .was-validated .form-control:invalid ~ .invalid-feedback,
        .form-control.is-invalid ~ .invalid-feedback {
            display: block !important;
            animation: slideDownFeedback 0.38s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .pw-toggle {
            -webkit-appearance: none;
            appearance: none;
            position: absolute;
            top: 24px;
            right: 0.5rem;
            transform: translateY(-50%);
            display: inline-grid;
            place-items: center;
            width: 36px;
            height: 36px;
            padding: 0;
            border: 0;
            border-radius: 10px;
            background: transparent;
            color: #64748b;
            z-index: 5;
        }

        .pw-toggle:focus {
            outline: none;
        }

        .pw-toggle:focus-visible {
            outline: 2px solid #ff7f50;
            outline-offset: 0;
            box-shadow: none;
        }

        .pw-toggle:hover {
            color: #e86738;
            background: transparent;
        }

        .pw-toggle svg[hidden] {
            display: none;
        }

        /* Bootstrap paints a green tick / red icon at the right edge of a validated input: it ran under the show-password button. */
        .has-toggle .form-control.form-control-icon:valid,
        .has-toggle .form-control.form-control-icon:invalid,
        .has-toggle .form-control.form-control-icon.is-valid,
        .has-toggle .form-control.form-control-icon.is-invalid,
        .was-validated .has-toggle .form-control.form-control-icon:valid,
        .was-validated .has-toggle .form-control.form-control-icon:invalid {
            background-image: none !important;
            padding-right: 3rem !important;
        }

        .has-toggle .form-control-icon {
            padding-right: 3rem !important;
        }
    
        .otp-input {
            letter-spacing: 0.55em;
            text-align: center;
            font-size: 1.4rem;
            font-weight: 700;
            padding-left: 1rem !important;
            font-variant-numeric: tabular-nums;
        }

        .pw-toggle {
            -webkit-appearance: none;
            appearance: none;
            position: absolute;
            top: 24px;
            right: 0.5rem;
            transform: translateY(-50%);
            display: inline-grid;
            place-items: center;
            width: 36px;
            height: 36px;
            padding: 0;
            border: 0;
            border-radius: 10px;
            background: transparent;
            color: #64748b;
            z-index: 5;
        }

        .pw-toggle:hover {
            color: #e86738;
            background: transparent;
        }

        .pw-toggle svg[hidden] {
            display: none;
        }

        .has-toggle .form-control-icon {
            padding-right: 3rem !important;
        }

        .auth-error {
            display: flex;
            align-items: flex-start;
            gap: 0.4rem;
            margin-top: 0.4rem;
            font-size: 0.84rem;
            font-weight: 600;
            color: #b91c1c;
        }

        .auth-hint {
            margin-top: 0.4rem;
            font-size: 0.82rem;
            color: #707780;
        }

        .email-chip {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.7rem 1rem;
            border-radius: 14px;
            background: #fff5f1;
            border: 1px solid #ffdcd1;
            font-size: 0.92rem;
            font-weight: 700;
            color: #292d32;
            overflow-wrap: anywhere;
        }

        .auth-secondary {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 0.5rem 1rem;
            margin-top: 1.25rem;
            font-size: 0.88rem;
        }

        .auth-secondary button {
            padding: 0;
            border: 0;
            background: none;
            font: inherit;
            font-weight: 700;
        }

        /* the browser's autofill colour must not paint over the field (it did, once the text was shown) */
        .form-control-icon:-webkit-autofill,
        .form-control-icon:-webkit-autofill:hover,
        .form-control-icon:-webkit-autofill:focus {
            -webkit-text-fill-color: #292d32;
            -webkit-box-shadow: 0 0 0 1000px #fffaf9 inset;
            box-shadow: 0 0 0 1000px #fffaf9 inset;
            caret-color: #292d32;
            transition: background-color 9999s ease-out 0s;
        }
</style>
</head>
<body class="os-home">
<div class="auth-wrapper">
    <div class="auth-card p-4 p-sm-5">
        <div class="auth-header">
            <div class="os-eyebrow mb-3">
                <span class="os-eyebrow-dot"></span>
                ONESHOP · TÀI KHOẢN
            </div>
            <h1>Quên <span>mật khẩu</span></h1>
            <p>Nhập email đã đăng ký, chúng tôi sẽ gửi mã OTP để bạn đặt lại mật khẩu.</p>
        </div>

        <form th:action="@{/forgot-password}" th:object="${forgotPasswordRequest}" method="post" id="forgot-form" novalidate>
            <div class="mb-4">
                <label class="form-label" for="email">Email đã đăng ký</label>
                <div class="input-group-custom">
                    <span class="input-icon-lead"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg></span>
                    <input type="email" class="form-control form-control-icon" id="email" name="email" th:value="*{email}"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                           th:attr="aria-invalid=${#fields.hasErrors('email')}"
                           placeholder="ban@example.com" autocomplete="email" autocapitalize="none" spellcheck="false" required autofocus>
                </div>
                <div class="auth-error" th:if="${#fields.hasErrors('email')}"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-top: 0.15rem; flex: none"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg><span th:text="${#fields.errors('email')[0]}">Lỗi</span></div>
            </div>

            <button type="submit" class="btn btn-primary btn-auth-submit w-100" id="forgot-submit">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg>
                <span>Gửi mã OTP</span>
            </button>
        </form>

        <p class="text-center text-muted small mt-4 mb-0">
            Đã nhớ mật khẩu?
            <a th:href="@{/login}" class="auth-footer-link">Quay lại đăng nhập</a>
        </p>
    </div>
</div>

<script>
    (function () {
        var form = document.getElementById('forgot-form');
        var button = document.getElementById('forgot-submit');
        if (!form || !button) return;
        var sent = false;
        form.addEventListener('submit', function (event) {
            if (sent) { event.preventDefault(); return; }
            sent = true;
            button.setAttribute('aria-busy', 'true');
            button.querySelector('span').textContent = 'Đang gửi…';
        });
    })();
</script>
</body>
</html>
