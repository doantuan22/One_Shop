<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu - OneShop</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/bootstrap-coral.css}">
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <style>
        .auth-wrapper {
            min-height: calc(100vh - 120px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2.5rem 1rem;
        }

        .auth-card {
            background: #ffffff;
            border: 1px solid rgba(255, 127, 80, 0.2);
            border-radius: 24px;
            box-shadow: 0 16px 40px rgba(255, 127, 80, 0.08);
            position: relative;
            overflow: hidden;
            width: 100%;
            max-width: 480px;
        }

        .auth-card::before {
            content: "";
            position: absolute;
            top: -70px;
            right: -70px;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 127, 80, 0.15), transparent 70%);
            pointer-events: none;
        }

        .auth-card::after {
            content: "";
            position: absolute;
            bottom: -60px;
            left: -60px;
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 171, 145, 0.18), transparent 70%);
            pointer-events: none;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-header h1 {
            font-size: 1.85rem;
            font-weight: 800;
            color: var(--os-text, #292d32);
            letter-spacing: -0.03em;
            margin-bottom: 0.5rem;
        }

        .auth-header h1 span {
            color: var(--os-coral-dark, #e86738);
        }

        .auth-header p {
            color: var(--os-muted, #707780);
            font-size: 0.95rem;
            margin-bottom: 0;
        }

        .input-group-custom {
            position: relative;
        }

        .input-icon-lead {
            position: absolute;
            top: 24px;
            left: 1rem;
            transform: translateY(-50%);
            color: #a0a6b1;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 4;
            pointer-events: none;
            transition: color 0.3s ease;
        }

        /* ui-system.css loads later and sets .form-control { min-height: 40px }, which made the field 40px tall while the
           icon is centred for 48px (4px too low): a higher specificity and a fixed height keep one shared centre */
        .input-group-custom .form-control-icon {
            padding-left: 2.75rem !important;
            height: 48px;
            min-height: 48px;
            border-radius: 14px;
            border: 1px solid #f0e6e3;
            background-color: #fffaf9;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .form-control-icon:focus {
            background-color: #ffffff;
            border-color: var(--bs-primary, #ff7f50) !important;
            box-shadow: 0 0 0 0.25rem rgba(255, 127, 80, 0.18) !important;
        }

        .form-control-icon:focus + .input-icon-lead,
        .input-group-custom:focus-within .input-icon-lead {
            color: var(--bs-primary, #ff7f50);
        }

        .form-label {
            font-size: 0.875rem;
            font-weight: 600;
            color: #495057;
            margin-bottom: 0.4rem;
        }

        .btn-auth-submit {
            min-height: 48px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 1rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, #ff7f50, #e86738);
            border: none;
            box-shadow: 0 6px 18px rgba(255, 127, 80, 0.25);
            transition: background 0.2s ease, box-shadow 0.2s ease;
            transform: none !important;
        }

        .btn-auth-submit:hover {
            transform: none !important;
            box-shadow: 0 8px 22px rgba(255, 127, 80, 0.35);
            background: linear-gradient(135deg, #e86738, #d65426);
            color: #ffffff;
        }

        .auth-alert {
            border-radius: 12px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0.85rem 1rem;
            border-width: 1px;
        }

        .auth-footer-link {
            color: #ff7f50;
            font-weight: 700;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .auth-footer-link:hover {
            color: #e86738;
            text-decoration: underline;
        }

        @keyframes slideDownFeedback {
            0% {
                opacity: 0;
                transform: translateY(-8px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        :focus-visible {
            outline: 3px solid #1f2937;
            outline-offset: 2px;
            box-shadow: 0 0 0 5px #ffffff;
        }

        .invalid-feedback {
            display: none;
            font-size: 0.825rem;
            color: #dc3545;
            margin-top: 0.35rem;
        }

        .was-validated .form-control:invalid ~ .invalid-feedback,
        .form-control.is-invalid ~ .invalid-feedback {
            display: block !important;
            animation: slideDownFeedback 0.38s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .pw-toggle {
            -webkit-appearance: none;
            appearance: none;
            position: absolute;
            top: 24px;
            right: 0.5rem;
            transform: translateY(-50%);
            display: inline-grid;
            place-items: center;
            width: 36px;
            height: 36px;
            padding: 0;
            border: 0;
            border-radius: 10px;
            background: transparent;
            color: #64748b;
            z-index: 5;
        }

        .pw-toggle:focus {
            outline: none;
        }

        .pw-toggle:focus-visible {
            outline: 2px solid #ff7f50;
            outline-offset: 0;
            box-shadow: none;
        }

        .pw-toggle:hover {
            color: #e86738;
            background: transparent;
        }

        /* Edge draws its own reveal button inside a password field: ours is the only one */
        input[type="password"]::-ms-reveal,
        input[type="password"]::-ms-clear {
            display: none;
        }

        .pw-toggle svg[hidden] {
            display: none;
        }

        .has-toggle .form-control-icon {
            padding-right: 3rem !important;
        }
    
        .otp-input {
            letter-spacing: 0.55em;
            text-align: center;
            font-size: 1.4rem;
            font-weight: 700;
            padding-left: 1rem !important;
            font-variant-numeric: tabular-nums;
        }

        .pw-toggle {
            -webkit-appearance: none;
            appearance: none;
            position: absolute;
            top: 24px;
            right: 0.5rem;
            transform: translateY(-50%);
            display: inline-grid;
            place-items: center;
            width: 36px;
            height: 36px;
            padding: 0;
            border: 0;
            border-radius: 10px;
            background: transparent;
            color: #64748b;
            z-index: 5;
        }

        .pw-toggle:hover {
            color: #e86738;
            background: transparent;
        }

        .pw-toggle svg[hidden] {
            display: none;
        }

        .has-toggle .form-control-icon {
            padding-right: 3rem !important;
        }

        .auth-error {
            display: flex;
            align-items: flex-start;
            gap: 0.4rem;
            margin-top: 0.4rem;
            font-size: 0.84rem;
            font-weight: 600;
            color: #b91c1c;
        }

        .auth-hint {
            margin-top: 0.4rem;
            font-size: 0.82rem;
            color: #707780;
        }

        .email-chip {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.7rem 1rem;
            border-radius: 14px;
            background: #fff5f1;
            border: 1px solid #ffdcd1;
            font-size: 0.92rem;
            font-weight: 700;
            color: #292d32;
            overflow-wrap: anywhere;
        }

        .auth-secondary {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 0.5rem 1rem;
            margin-top: 1.25rem;
            font-size: 0.88rem;
        }

        .auth-secondary button {
            padding: 0;
            border: 0;
            background: none;
            font: inherit;
            font-weight: 700;
        }

        /* the browser's autofill colour must not paint over the field (it did, once the text was shown) */
        .form-control-icon:-webkit-autofill,
        .form-control-icon:-webkit-autofill:hover,
        .form-control-icon:-webkit-autofill:focus {
            -webkit-text-fill-color: #292d32;
            -webkit-box-shadow: 0 0 0 1000px #fffaf9 inset;
            box-shadow: 0 0 0 1000px #fffaf9 inset;
            caret-color: #292d32;
            transition: background-color 9999s ease-out 0s;
        }
</style>
</head>
<body class="os-home">
<div class="auth-wrapper">
    <div class="auth-card p-4 p-sm-5">
        <div class="auth-header">
            <div class="os-eyebrow mb-3">
                <span class="os-eyebrow-dot"></span>
                ONESHOP · TÀI KHOẢN
            </div>
            <h1>Đặt lại <span>mật khẩu</span></h1>
            <p>Mã OTP đã được xác nhận. Hãy chọn mật khẩu mới cho tài khoản của bạn.</p>
        </div>

        <form th:action="@{/forgot-password/reset}" th:object="${resetPasswordRequest}" method="post" id="reset-form" autocomplete="off" novalidate>
            <input type="hidden" name="email" th:value="*{email}">
            <input type="hidden" name="ticket" th:value="*{ticket}">

            <div class="mb-3">
                <span class="form-label d-block">Tài khoản đặt lại mật khẩu</span>
                <div class="email-chip"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg><span th:text="*{email}">ban@example.com</span></div>
                <div class="auth-error" th:if="${#fields.hasErrors('email')}"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-top: 0.15rem; flex: none"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg><span th:text="${#fields.errors('email')[0]}">Lỗi</span></div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="newPassword">Mật khẩu mới</label>
                <div class="input-group-custom has-toggle">
                    <span class="input-icon-lead"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></span>
                    <input type="password" class="form-control form-control-icon" id="newPassword" name="newPassword" autocomplete="new-password" maxlength="72"
                           th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'"
                           th:attr="aria-invalid=${#fields.hasErrors('newPassword')}" required>
                    <button type="button" class="pw-toggle" data-toggle="newPassword" data-show="Hiện mật khẩu mới" data-hide="Ẩn mật khẩu mới" aria-label="Hiện mật khẩu mới" title="Hiện mật khẩu mới"><svg class="i-show" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg><svg class="i-hide" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg></button>
                </div>
                <div class="auth-error" th:if="${#fields.hasErrors('newPassword')}"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-top: 0.15rem; flex: none"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg><span th:text="${#fields.errors('newPassword')[0]}">Lỗi</span></div><div class="auth-hint" th:unless="${#fields.hasErrors('newPassword')}">Mật khẩu từ 8 đến 72 ký tự.</div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="confirmPassword">Nhập lại mật khẩu mới</label>
                <div class="input-group-custom has-toggle">
                    <span class="input-icon-lead"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></span>
                    <input type="password" class="form-control form-control-icon" id="confirmPassword" name="confirmPassword" autocomplete="new-password" maxlength="72"
                           th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"
                           th:attr="aria-invalid=${#fields.hasErrors('confirmPassword')}" required>
                    <button type="button" class="pw-toggle" data-toggle="confirmPassword" data-show="Hiện nhập lại mật khẩu mới" data-hide="Ẩn nhập lại mật khẩu mới" aria-label="Hiện nhập lại mật khẩu mới" title="Hiện nhập lại mật khẩu mới"><svg class="i-show" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg><svg class="i-hide" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg></button>
                </div>
                <div class="auth-error" th:if="${#fields.hasErrors('confirmPassword')}"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-top: 0.15rem; flex: none"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg><span th:text="${#fields.errors('confirmPassword')[0]}">Lỗi</span></div>
            </div>

            <button type="submit" class="btn btn-primary btn-auth-submit w-100 mt-2" id="reset-submit">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                <span>Đặt lại mật khẩu</span>
            </button>
        </form>

        <div class="auth-secondary">
            <a th:href="@{/forgot-password}" class="auth-footer-link">Làm lại từ đầu</a>
            <a th:href="@{/login}" class="auth-footer-link">Đăng nhập</a>
        </div>
    </div>
</div>

<script>
    (function () {
        var form = document.getElementById('reset-form');
        var button = document.getElementById('reset-submit');
        if (form && button) {
            var sent = false;
            form.addEventListener('submit', function (event) {
                if (sent) { event.preventDefault(); return; }
                sent = true;
                button.setAttribute('aria-busy', 'true');
                button.querySelector('span').textContent = 'Đang xử lý…';
            });
        }
        var firstError = document.querySelector('.is-invalid');
        if (firstError) firstError.focus();
    })();
</script>
<script th:src="@{/js/password-toggle.js}" defer></script>
</body>
</html>
