spring.application.name=oneshop
spring.profiles.default=dev

# --- Server ---
server.port=${PORT:8080}
server.shutdown=graceful
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.compression.enabled=true

# --- Datasource: Microsoft SQL Server (credentials come only from environment variables) ---
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:oneshop};encrypt=true;trustServerCertificate=${DB_TRUST_SERVER_CERTIFICATE:false}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
# Do not abort startup when the pool cannot connect yet; connections are made lazily.
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:10000}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# --- JPA / Hibernate ---
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
# NVARCHAR for String columns so Vietnamese text is stored correctly
spring.jpa.properties.hibernate.use_nationalized_character_data=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Thymeleaf / JSON ---
spring.thymeleaf.encoding=UTF-8
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.web.locale=vi_VN

# --- Application: JWT ---
# JWT_SECRET has no default on purpose: the application refuses to start without a strong secret.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.jwt.cookie-name=ONESHOP_TOKEN
app.jwt.cookie-secure=${JWT_COOKIE_SECURE:true}

# --- Application: Cloudinary ---
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
app.cloudinary.folder=oneshop

# --- Logging (never log secrets) ---
logging.level.root=INFO
