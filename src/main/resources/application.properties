spring.application.name=oneshop
spring.profiles.default=dev

# --- Server ---
server.port=${PORT:8080}
server.shutdown=graceful
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.compression.enabled=true

# --- Datasource: Microsoft SQL Server (credentials come only from environment variables) ---
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:oneshop};encrypt=true;trustServerCertificate=${DB_TRUST_SERVER_CERTIFICATE:false}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
# Do not abort startup when the pool cannot connect yet; connections are made lazily.
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:10000}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# --- JPA / Hibernate ---
spring.jpa.open-in-view=false
# NVARCHAR for String columns so Vietnamese text is stored correctly (matches the NVARCHAR schema)
spring.jpa.properties.hibernate.use_nationalized_character_data=true

# --- Thymeleaf / JSON ---
spring.thymeleaf.encoding=UTF-8
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.web.locale=vi_VN

# --- Application: JWT ---
# JWT_SECRET has no default on purpose: the application refuses to start without a strong secret.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.jwt.cookie-name=ONESHOP_TOKEN
app.jwt.cookie-secure=${JWT_COOKIE_SECURE:true}

# --- Uploads: product images and brand logos are passed on to Cloudinary, never stored here ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# --- Application: Cloudinary ---
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
app.cloudinary.folder=oneshop
app.cloudinary.connect-timeout-seconds=${CLOUDINARY_CONNECT_TIMEOUT_SECONDS:5}
app.cloudinary.read-timeout-seconds=${CLOUDINARY_READ_TIMEOUT_SECONDS:15}
app.cloudinary.timeout-seconds=${CLOUDINARY_TIMEOUT_SECONDS:15}

# --- Logging (never log secrets) ---
logging.level.root=INFO

spring.config.import=optional:file:./.env[.properties]

# --- V3 checkout & payment (DEC-15, DEC-17, DEC-20) ---
# Business values: 15 minutes to pay, then 15 minutes of reconciliation. Do not change without the owner's approval.
oneshop.payment.pending-timeout-minutes=${ONESHOP_PAYMENT_PENDING_TIMEOUT_MINUTES:15}
oneshop.payment.reconciliation-window-minutes=${ONESHOP_PAYMENT_RECONCILIATION_WINDOW_MINUTES:15}
oneshop.payment.timeout-scan-interval-ms=${ONESHOP_PAYMENT_TIMEOUT_SCAN_INTERVAL_MS:60000}
# Explicit opt-in after reviewing historical orders; switching databases must not start a global write job.
oneshop.payment.timeout-worker-enabled=${ONESHOP_PAYMENT_TIMEOUT_WORKER_ENABLED:false}
oneshop.payment.scan-batch-size=${ONESHOP_PAYMENT_SCAN_BATCH_SIZE:200}
# Server-side mock payment gateway (DEC-21): customer simulation and Admin gateway console. Never on in production.
oneshop.payment.mock-gateway-enabled=${ONESHOP_PAYMENT_MOCK_GATEWAY_ENABLED:true}
# Delivery policy, APPROVED by the project owner (DEC-24, DEC-25): every ACTIVE Store with delivery_enabled may serve
# any valid delivery address in Vietnam (no GPS, no distance); a DELIVERY Order costs a fixed fee once per Order
# (every independent Order of a COD split pays its own); Store pickup is free. UNDECIDED = fail-closed kill switch.
oneshop.checkout.delivery-service-area-policy=${ONESHOP_CHECKOUT_DELIVERY_SERVICE_AREA_POLICY:ALL_DELIVERY_ENABLED_STORES}
oneshop.checkout.shipping-fee-policy=${ONESHOP_CHECKOUT_SHIPPING_FEE_POLICY:FIXED_PER_ORDER}
oneshop.checkout.shipping-fee-per-order=${ONESHOP_CHECKOUT_SHIPPING_FEE_PER_ORDER:30000}
# ONLINE checkout stays closed by release policy; enable only in an explicitly isolated demo/test.
oneshop.checkout.online-enabled=${ONESHOP_CHECKOUT_ONLINE_ENABLED:false}
