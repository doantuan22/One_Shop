spring.application.name=oneshop
spring.profiles.default=dev

# --- Server ---
server.port=${PORT:8080}
server.shutdown=graceful
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.compression.enabled=true

# --- Datasource: Microsoft SQL Server (credentials come only from environment variables) ---
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:oneshop};encrypt=true;trustServerCertificate=${DB_TRUST_SERVER_CERTIFICATE:false}${DB_JDBC_OPTIONS:}
# DB_JDBC_OPTIONS is appended to the URL, e.g. ";trustStore=/etc/oneshop/rds-truststore.jks;trustStorePassword=...;hostNameInCertificate=*.rds.amazonaws.com"
# (RDS certificates are signed by the Amazon RDS CA, which the default Java trust store does not contain).
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
# Do not abort startup when the pool cannot connect yet; connections are made lazily.
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:10000}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
# Retire pooled connections before a firewall / load balancer / RDS silently drops idle ones.
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1500000}
spring.datasource.hikari.keepalive-time=${DB_KEEPALIVE_MS:300000}

# --- JPA / Hibernate ---
spring.jpa.open-in-view=false
# NVARCHAR for String columns so Vietnamese text is stored correctly (matches the NVARCHAR schema)
spring.jpa.properties.hibernate.use_nationalized_character_data=true

# --- Thymeleaf / JSON ---
spring.thymeleaf.encoding=UTF-8
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.web.locale=vi_VN

# --- Outgoing mail (SMTP) for one-time codes: credentials come only from environment variables ---
# Leave MAIL_HOST empty to switch sending off: "forgot password" then says the system has no mail server yet.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.default-encoding=UTF-8
# The "From" address; defaults to the SMTP account itself.
oneshop.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}

# --- Application: JWT ---
# JWT_SECRET has no default on purpose: the application refuses to start without a strong secret.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.jwt.cookie-name=ONESHOP_TOKEN
app.jwt.cookie-secure=${JWT_COOKIE_SECURE:true}

# --- Uploads: product images and brand logos are passed on to Cloudinary, never stored here ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# --- Application: Cloudinary ---
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
app.cloudinary.folder=oneshop
app.cloudinary.connect-timeout-seconds=${CLOUDINARY_CONNECT_TIMEOUT_SECONDS:5}
app.cloudinary.read-timeout-seconds=${CLOUDINARY_READ_TIMEOUT_SECONDS:15}
app.cloudinary.timeout-seconds=${CLOUDINARY_TIMEOUT_SECONDS:15}

# --- Errors: never send stack traces, exception messages or binding details to the browser ---
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# --- Logging (never log secrets) ---
logging.level.root=INFO

spring.config.import=optional:file:./.env[.properties]

# --- V3 checkout & payment (DEC-15, DEC-17, DEC-20) ---
# Business values: 15 minutes to pay, then 15 minutes of reconciliation. Do not change without the owner's approval.
oneshop.payment.pending-timeout-minutes=${ONESHOP_PAYMENT_PENDING_TIMEOUT_MINUTES:15}
oneshop.payment.reconciliation-window-minutes=${ONESHOP_PAYMENT_RECONCILIATION_WINDOW_MINUTES:15}
oneshop.payment.timeout-scan-interval-ms=${ONESHOP_PAYMENT_TIMEOUT_SCAN_INTERVAL_MS:60000}
# OFF by default (BUG-001): the background scan writes to the database (cancels overdue unpaid ONLINE Orders and gives
# their stock back, DEC-15), so it only runs where it is switched on explicitly with ONESHOP_PAYMENT_TIMEOUT_WORKER_ENABLED=true.
# While it is off, overdue ONLINE Orders wait in the Admin payment console ("Cần xử lý") and are also settled when their
# owner opens the order or payment page.
oneshop.payment.timeout-worker-enabled=${ONESHOP_PAYMENT_TIMEOUT_WORKER_ENABLED:false}
oneshop.payment.scan-batch-size=${ONESHOP_PAYMENT_SCAN_BATCH_SIZE:200}
# Server-side mock payment gateway (DEC-21): customer simulation and Admin gateway console. Never on in production.
oneshop.payment.mock-gateway-enabled=${ONESHOP_PAYMENT_MOCK_GATEWAY_ENABLED:true}
# Which gateway settles ONLINE payments: MOCK (simulation, dev/test) or PAYOS (real money, payOS hosted checkout).
# With PAYOS every simulation endpoint is refused, whatever mock-gateway-enabled says, and nothing falls back to a simulated success.
oneshop.payment.provider=${ONESHOP_PAYMENT_PROVIDER:MOCK}
# --- payOS (only used when oneshop.payment.provider=PAYOS). Keys live ONLY in the server environment / .env, never in Git. ---
oneshop.payos.client-id=${PAYOS_CLIENT_ID:}
oneshop.payos.api-key=${PAYOS_API_KEY:}
oneshop.payos.checksum-key=${PAYOS_CHECKSUM_KEY:}
# Public https origin of OneShop (no path): payOS sends the customer back to, and calls the webhook on, this address.
oneshop.payos.public-base-url=${ONESHOP_PUBLIC_BASE_URL:}
oneshop.payos.timeout-ms=${PAYOS_TIMEOUT_MS:15000}
oneshop.payos.max-retries=${PAYOS_MAX_RETRIES:1}
oneshop.payos.min-amount=${PAYOS_MIN_AMOUNT:2000}
oneshop.payos.max-amount=${PAYOS_MAX_AMOUNT:500000000}
# Delivery policy, APPROVED by the project owner (DEC-24, DEC-25): every ACTIVE Store with delivery_enabled may serve
# any valid delivery address in Vietnam (no GPS, no distance); a DELIVERY Order costs a fixed fee once per Order
# (every independent Order of a COD split pays its own); Store pickup is free. UNDECIDED = fail-closed kill switch.
oneshop.checkout.delivery-service-area-policy=${ONESHOP_CHECKOUT_DELIVERY_SERVICE_AREA_POLICY:ALL_DELIVERY_ENABLED_STORES}
oneshop.checkout.shipping-fee-policy=${ONESHOP_CHECKOUT_SHIPPING_FEE_POLICY:FIXED_PER_ORDER}
oneshop.checkout.shipping-fee-per-order=${ONESHOP_CHECKOUT_SHIPPING_FEE_PER_ORDER:30000}
# ONLINE checkout (DEC-06): one Order, one Payment, N Fulfillments, paid through the server-side MOCK gateway (DEC-21).
# BE-05 (15-minute timeout, reconciliation, cancel/restore, refund simulation) is implemented, so it is open by default.
# The `prod` profile closes it again because the mock gateway is never on in production (no real gateway exists).
oneshop.checkout.online-enabled=${ONESHOP_CHECKOUT_ONLINE_ENABLED:true}

# Login brute-force guard (in-memory, per JVM): attempts per account and wrong logins per client IP in one window
oneshop.security.login-throttle.enabled=${ONESHOP_LOGIN_THROTTLE_ENABLED:true}
oneshop.security.login-throttle.max-attempts=${ONESHOP_LOGIN_MAX_ATTEMPTS:5}
oneshop.security.login-throttle.ip-max-failures=${ONESHOP_LOGIN_IP_MAX_FAILURES:30}
oneshop.security.login-throttle.window-minutes=${ONESHOP_LOGIN_WINDOW_MINUTES:15}
oneshop.security.login-throttle.lock-minutes=${ONESHOP_LOGIN_LOCK_MINUTES:15}
