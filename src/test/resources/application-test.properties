# Test profile: no real database and no real secrets are needed.
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${oneshop.test.db:oneshop_test};encrypt=true;trustServerCertificate=${DB_TRUST_SERVER_CERTIFICATE:false}
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
# No JDBC metadata is read, so Hibernate cannot detect the dialect itself
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.datasource.hikari.initialization-fail-timeout=-1

# Dummy test-only secret (not used anywhere else)
app.jwt.secret=test-only-secret-test-only-secret-1234567890
app.jwt.cookie-secure=false
app.cloudinary.cloud-name=
app.cloudinary.api-key=
app.cloudinary.api-secret=

# tests call the timeout scan directly; a background worker would race with their fixtures
oneshop.payment.timeout-worker-enabled=false

# tests never talk to payOS, whatever the developer .env says (PayosWebIntegrationTest overrides this explicitly)
oneshop.payment.provider=MOCK
