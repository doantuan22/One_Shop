# Test profile: no real database and no real secrets are needed.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.datasource.hikari.initialization-fail-timeout=-1

# Dummy test-only secret (not used anywhere else)
app.jwt.secret=test-only-secret-test-only-secret-1234567890
app.jwt.cookie-secure=false
app.cloudinary.cloud-name=
app.cloudinary.api-key=
app.cloudinary.api-secret=
